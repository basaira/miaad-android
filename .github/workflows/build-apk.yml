name: Build Miaad APK

on:
  workflow_dispatch:
  push:
    branches: [ main, chronometric-luxury-final, chronometric-luxury-audited-20260908 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python3 -m pip install Pillow==11.3.0 androguard==4.1.3
      - name: Validate source artwork and JavaScript
        run: |
          python3 scripts/audit_brand.py
          node scripts/test-schedule.cjs
          node scripts/test-domain.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Decode and audit built APK
        run: |
          python3 scripts/audit_brand.py --apk app/build/outputs/apk/debug/app-debug.apk --output audit
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > audit/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources app/build/outputs/apk/debug/app-debug.apk > audit/aapt-resources.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > audit/apk-signature.txt
          grep -q 'miaad_splash_icon' audit/aapt-resources.txt
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 12 offline launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash scripts/emulator_smoke.sh
      - name: Upload audited APK
        uses: actions/upload-artifact@v4
        with:
          name: miaad-chronometric-luxury-v1.2.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-brand-audit-v1.2.0
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

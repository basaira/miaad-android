name: Build Miaad APK

on:
  workflow_dispatch:
  push:
    branches: [ main, chronometric-luxury-final ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local UI JavaScript
        run: |
          node --check app/src/main/assets/app-core.js
          node --check app/src/main/assets/app-engine.js
          node --check app/src/main/assets/app-render.js
          node --check app/src/main/assets/app-editor.js
          node --check app/src/main/assets/app-events.js
          node --check app/src/main/assets/app-luxury.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miaad-chronometric-luxury-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

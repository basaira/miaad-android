name: Build Miaad APK

on:
  workflow_dispatch:
  push:
    branches: [ main, chronometric-luxury-final, chronometric-luxury-audited-20260908, 'miaad/phase-0-baseline', 'miaad/phase-0.5-webview69' ]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline build and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audit and compatibility dependencies
        run: |
          python3 -m pip install Pillow==11.3.0 androguard==4.1.3 websocket-client==1.8.0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3 esbuild@0.28.2 acorn@8.18.0
      - name: Validate modern source artwork and JavaScript
        run: |
          python3 scripts/audit_brand.py
          node scripts/test-schedule.cjs
          node scripts/test-domain.cjs
          node scripts/test-quality-invariants.cjs
      - name: Modern source browser flow, report and UI standards tests
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          node scripts/test-flows.cjs
          node scripts/test-browser.cjs
          node scripts/test-report-invariants.cjs
          node scripts/test-ui-standards.cjs
      - name: Inventory WebView 69 compatibility surface
        run: node scripts/audit-js-compat.cjs
      - name: Generate WebView 69 shipping assets
        run: node scripts/build-compat.cjs
      - name: Verify generated shipping JavaScript
        env:
          PLAYWRIGHT_CHANNEL: chrome
          MIAAD_ASSET_ROOT: ${{ github.workspace }}/app/build/generated/compatAssets
        run: |
          node scripts/test-shipping-compat.cjs
          node scripts/test-schedule.cjs
          node scripts/test-domain.cjs
          node scripts/test-flows.cjs
          node scripts/test-browser.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Record baseline environment
        run: |
          echo "repository=$GITHUB_REPOSITORY"
          echo "branch=$GITHUB_REF_NAME"
          echo "commit=$(git rev-parse HEAD)"
          echo "commit_date=$(git log -1 --format=%cI)"
          git status --short --branch
          echo "node=$(node --version)"
          node -e "console.log('esbuild='+require('esbuild').version);console.log('acorn='+require('acorn').version)"
          java -version
          gradle --version
          python3 - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('app/google-services.json').read_text())
          info=config['project_info']
          client=config['client'][0]['client_info']
          print('firebase_project_id='+info['project_id'])
          print('firebase_project_number='+info['project_number'])
          print('firebase_android_app_id='+client['mobilesdk_app_id'])
          print('firebase_package='+client['android_client_info']['package_name'])
          PY
      - name: Android lint and unit-test gate
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Decode and audit built APK
        run: |
          python3 scripts/audit_brand.py --apk app/build/outputs/apk/debug/app-debug.apk --output audit --apk-assets app/build/generated/compatAssets
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > audit/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources app/build/outputs/apk/debug/app-debug.apk > audit/aapt-resources.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > audit/apk-signature.txt
          grep -q 'miaad_splash_icon' audit/aapt-resources.txt
          node scripts/verify-apk-compat.cjs app/build/outputs/apk/debug/app-debug.apk
          stat -c '%s' app/build/outputs/apk/debug/app-debug.apk > audit/apk-size-bytes.txt
      - name: Upload audited APK
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-0-5-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload static audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-0-5-static-audit
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

  android-api:
    name: Android API ${{ matrix.api }} runtime gate
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 31, 34, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install runtime audit dependency
        run: python3 -m pip install websocket-client==1.8.0
      - name: Download baseline APK
        uses: actions/download-artifact@v4
        with:
          name: miaad-phase-0-5-apk
          path: app/build/outputs/apk/debug
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed APK on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: MIAAD_API_LEVEL=${{ matrix.api }} bash scripts/emulator_smoke.sh
      - name: Upload API ${{ matrix.api }} runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-0-5-runtime-api-${{ matrix.api }}
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

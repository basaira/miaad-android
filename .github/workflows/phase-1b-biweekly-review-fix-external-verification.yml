          old="result['afterRestart']=after_restart"; new="""result['benignWebViewUserGestureWarningCount']=len(benign_miaad_web_lines)\nresult['genuineFatalMiaadWebErrorCount']=len(fatal_miaad_web_lines)\nif benign_miaad_web_lines:\n    print('BENIGN WEBVIEW USER-GESTURE WARNING — NON-FATAL')\nresult['afterRestart']=after_restart"""; assert text.count(old)==1; text=text.replace(old,new)
          assert '?.' not in text and '??' not in text; probe.write_text(text,encoding='utf-8')

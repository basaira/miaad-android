          p=argparse.ArgumentParser(); p.add_argument('log',nargs='?'); p.add_argument('--stage',default='runtime'); p.add_argument('--api',default='unknown'); p.add_argument('--output'); p.add_argument('--self-check',action='store_true'); a=p.parse_args()
          if a.self_check: self_check(); raise SystemExit(0)

name: Phase 1B Slice 2 External Verification

on:
  push:
    branches: [ 'miaad/phase-1b-s2-runtime-verification' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: 0304a5cb7764ba5601b54b735da983eb6747718f
  CANDIDATE_TREE: bd9c3675cba8aa17a5eac992ad4d2bab9a9cae50

jobs:
  verification:
    name: Source, generated assets and Android gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert verification-only branch and authoritative source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          mapfile -t changed < <(git diff --name-only "$CANDIDATE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/phase-1b-s2-external-verification.yml"
          git diff --check "$CANDIDATE_SHA" HEAD
          test "$(git hash-object app/src/main/assets/app-domain.js)" = "c27166a33d957c34f07c51b69ab634569eab0bea"
          test "$(git hash-object app/src/main/assets/app-integration.js)" = "9a035febbad49bb21b3730038697b29ff3be734a"
          test "$(git hash-object app/src/main/assets/app-ui-hotfix.js)" = "ffeac59cc32796143988c36b87768ffe85001787"
          test "$(git hash-object scripts/test-timezone-dst-contract.cjs)" = "bf1347dceffa67fe1dfe5971fe21cfc4998cd5c0"
          test "$(git hash-object scripts/test-scheduling-contract.cjs)" = "60664b0a7342a5baf1f23cc10d00941d9f372e1f"
          mkdir -p audit
          printf '%s\n' "verification_head=$(git rev-parse HEAD)" "candidate=$CANDIDATE_SHA" "candidate_tree=$CANDIDATE_TREE" > audit/s2-source-identity.txt
          git diff --name-status "$CANDIDATE_SHA" HEAD >> audit/s2-source-identity.txt

      - name: Install authoritative audit and compatibility dependencies
        run: |
          python3 -m pip install Pillow==11.3.0 androguard==4.1.3 websocket-client==1.8.0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3 esbuild@0.28.2 acorn@8.18.0 @esbuild/linux-x64@0.28.2
          node scripts/verify-compat-toolchain.cjs

      - name: Run authoritative source gates
        env:
          PLAYWRIGHT_CHANNEL: chrome
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/test-schedule.cjs
          node scripts/test-domain.cjs
          node scripts/test-quality-invariants.cjs
          node scripts/test-scheduling-contract.cjs | tee audit/source-scheduling-contract.txt
          grep -Fxq 'PHASE 1B SCHEDULING CONTRACT PASS: 43 focused cases' audit/source-scheduling-contract.txt
          node scripts/test-timezone-dst-contract.cjs | tee audit/source-timezone-dst-contract.txt
          grep -Fxq 'PHASE 1B TIMEZONE/DST CONTRACT PASS: 39/39 focused cases' audit/source-timezone-dst-contract.txt
          node scripts/test-report-invariants.cjs
          node scripts/test-flows.cjs
          node scripts/test-browser.cjs
          node scripts/test-webview-harness-compat.cjs
          node scripts/audit-js-compat.cjs

      - name: Generate WebView 69 shipping assets
        run: node scripts/build-compat.cjs

      - name: Verify generated shipping assets
        env:
          PLAYWRIGHT_CHANNEL: chrome
          MIAAD_ASSET_ROOT: ${{ github.workspace }}/app/build/generated/compatAssets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-timezone-dst-contract.cjs | tee audit/generated-timezone-dst-contract.txt
          grep -Fxq 'PHASE 1B TIMEZONE/DST CONTRACT PASS: 39/39 focused cases' audit/generated-timezone-dst-contract.txt
          node scripts/test-scheduling-contract.cjs | tee audit/generated-scheduling-contract.txt
          grep -Fxq 'PHASE 1B SCHEDULING CONTRACT PASS: 43 focused cases' audit/generated-scheduling-contract.txt
          node scripts/test-shipping-compat.cjs
          node scripts/test-compat-shims.cjs
          node scripts/test-schedule.cjs
          node scripts/test-domain.cjs
          node scripts/test-flows.cjs
          node scripts/test-browser.cjs
          node scripts/test-report-invariants.cjs
          node scripts/audit-js-compat.cjs --shipping
          node scripts/compat-assets-manifest.cjs audit/generated-assets-tested.json > audit/generated-assets-tested.sha256

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Prove clean compatibility regeneration equivalence
        env:
          PLAYWRIGHT_CHANNEL: chrome
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build
          test ! -e app/build/generated/compatAssets
          gradle :app:generateCompatAssets --rerun-tasks --stacktrace
          export MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets"
          node scripts/test-timezone-dst-contract.cjs | tee audit/clean-generated-timezone-dst-contract.txt
          grep -Fxq 'PHASE 1B TIMEZONE/DST CONTRACT PASS: 39/39 focused cases' audit/clean-generated-timezone-dst-contract.txt
          node scripts/test-scheduling-contract.cjs | tee audit/clean-generated-scheduling-contract.txt
          grep -Fxq 'PHASE 1B SCHEDULING CONTRACT PASS: 43 focused cases' audit/clean-generated-scheduling-contract.txt
          node scripts/test-shipping-compat.cjs
          node scripts/audit-js-compat.cjs --shipping
          node scripts/compat-assets-manifest.cjs audit/generated-assets-cleanbuild.json > audit/generated-assets-cleanbuild.sha256
          cmp audit/generated-assets-tested.sha256 audit/generated-assets-cleanbuild.sha256

      - name: Android lint and unit-test gate
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK and verify generated equivalence
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          node scripts/compat-assets-manifest.cjs audit/generated-assets-final.json > audit/generated-assets-final.sha256
          cmp audit/generated-assets-tested.sha256 audit/generated-assets-final.sha256

      - name: Decode and audit built APK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_brand.py --apk app/build/outputs/apk/debug/app-debug.apk --output audit --apk-assets app/build/generated/compatAssets
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > audit/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources app/build/outputs/apk/debug/app-debug.apk > audit/aapt-resources.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > audit/apk-signature.txt
          grep -q 'miaad_splash_icon' audit/aapt-resources.txt
          node scripts/verify-apk-compat.cjs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee audit/apk-sha256-full.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}' > audit/apk-sha256.txt
          stat -c '%s' app/build/outputs/apk/debug/app-debug.apk > audit/apk-size-bytes.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1b-s2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload static verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1b-s2-static-audit
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

  android-api:
    name: Android API ${{ matrix.api }} runtime gate
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 31, 34, 36]
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Assert runtime source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/assets/app-domain.js)" = "c27166a33d957c34f07c51b69ab634569eab0bea"
          test "$(git hash-object app/src/main/assets/app-integration.js)" = "9a035febbad49bb21b3730038697b29ff3be734a"
          test "$(git hash-object app/src/main/assets/app-ui-hotfix.js)" = "ffeac59cc32796143988c36b87768ffe85001787"
          test "$(git hash-object scripts/test-timezone-dst-contract.cjs)" = "bf1347dceffa67fe1dfe5971fe21cfc4998cd5c0"
          test "$(git hash-object scripts/test-scheduling-contract.cjs)" = "60664b0a7342a5baf1f23cc10d00941d9f372e1f"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install runtime audit dependency
        run: python3 -m pip install websocket-client==1.8.0

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: miaad-phase-1b-s2-apk
          path: app/build/outputs/apk/debug

      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run installed APK and Slice-2 temporal probe on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set -euo pipefail
            MIAAD_API_LEVEL=${{ matrix.api }} bash scripts/emulator_smoke.sh
            cat > /tmp/miaad-s2-temporal-runtime.py <<'PY'
            import json, subprocess, time, urllib.request, websocket
            from pathlib import Path

            API='${{ matrix.api }}'
            PACKAGE='com.miaad.app'
            ACTIVITY=PACKAGE+'/.MainActivity'
            OUT=Path('audit')
            OUT.mkdir(exist_ok=True)

            def run(*args, check=True):
                return subprocess.run(list(args), text=True, capture_output=True, check=check)
            def adb(*args):
                return subprocess.check_output(['adb',*args], text=True).strip()
            def pid(timeout=45):
                end=time.time()+timeout
                while time.time()<end:
                    r=run('adb','shell','pidof',PACKAGE,check=False)
                    if r.returncode==0 and r.stdout.strip(): return r.stdout.strip().split()[0]
                    time.sleep(1)
                raise AssertionError('Miaad process did not appear')
            def start():
                run('adb','shell','am','start','-W','-n',ACTIVITY)
                return pid()
            def connect(timeout=60):
                end=time.time()+timeout; last=None
                while time.time()<end:
                    try:
                        p=pid(8)
                        adb('forward','tcp:9222','localabstract:webview_devtools_remote_'+p)
                        tabs=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                        pages=[t for t in tabs if t.get('type')=='page']
                        page=next((t for t in pages if 'android_asset' in (t.get('url') or '')),pages[0])
                        return websocket.create_connection(page['webSocketDebuggerUrl'],suppress_origin=True,timeout=60)
                    except Exception as exc:
                        last=exc; time.sleep(1)
                raise AssertionError(f'WebView connect failed: {last}')
            seq=0
            def evaluate(ws, expr):
                global seq
                seq+=1
                ws.send(json.dumps({'id':seq,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':True}}))
                while True:
                    msg=json.loads(ws.recv())
                    if msg.get('id')!=seq: continue
                    result=msg['result']
                    assert 'exceptionDetails' not in result, result
                    return result['result'].get('value')
            def ready(ws, timeout=60):
                end=time.time()+timeout
                while time.time()<end:
                    try:
                        if evaluate(ws,"typeof domain!=='undefined' && typeof currentOrNextOccurrence==='function' && typeof buildNativeReminders==='function' && window.__miaadUiHotfixApplied===true"):
                            return
                    except Exception: pass
                    time.sleep(1)
                raise AssertionError('Miaad runtime not ready')

            ws=connect(); ready(ws)
            before=evaluate(ws,r'''(()=>{
              const cfg=domain.copy(domain.data.settings);cfg.teacherTimeZone='Pacific/Honolulu';domain.saveSettings(cfg);
              const seed=domain.copy(domain.data);seed.schedules={};seed.records={};seed.notifications={};domain.replace(seed,{});
              const t=domain.teacherNow();
              let s=domain.data.students['s2-runtime-temporal'];
              if(!s)s=domain.saveStudent({id:'s2-runtime-temporal',name:'S2 temporal runtime',startDate:t.date,timeZone:'Asia/Tokyo',custom:false,settings:{}});
              const currentTime=t.time.slice(0,5);
              domain.saveSchedule({id:'s2-runtime-current',studentId:s.id,name:s.name,day:t.weekday,start:currentTime,duration:45,maxDuration:45,repeat:'weekly',reminder:10},t.date);
              const tomorrow=domain.plus(t.date,1);
              domain.saveSchedule({id:'s2-runtime-next',studentId:s.id,name:s.name,day:domain.weekdayForDate(tomorrow),start:'12:34',duration:30,maxDuration:30,repeat:'weekly',reminder:20},tomorrow);
              const current=currentOrNextOccurrence(),next=nextOccurrence();
              if(!current||current.lesson.id!=='s2-runtime-current'||!current.inProgress)throw Error('current lesson authority mismatch before device-zone change');
              if(!next||next.lesson.id!=='s2-runtime-current')throw Error('next occurrence authority mismatch before device-zone change');
              selectedDate=window.miaadCivilDate(tomorrow);renderWeekView();
              if(dateKey(selectedDate)!==tomorrow)throw Error('calendar civil identity mismatch before device-zone change');
              const expected=+domain.resolveWallClock(tomorrow,'12:34');
              const id='upcoming:'+tomorrow+'__s2-runtime-next';
              const reminder=buildNativeReminders(2).find(x=>x.id===id);
              if(!reminder||reminder.at!==expected-20*60000)throw Error('native reminder epoch mismatch before device-zone change');
              syncNativeReminders();domainCommit();
              return {teacherZone:domain.teacherZone(),teacherDate:t.date,currentId:current.lesson.id,nextId:next.lesson.id,tomorrow,calendar:dateKey(selectedDate),expected,reminderAt:reminder.at,deviceZone:Intl.DateTimeFormat().resolvedOptions().timeZone};
            })()''')
            assert before['teacherZone']=='Pacific/Honolulu', before
            ws.close()

            root=run('adb','root',check=False)
            (OUT/f'adb-root-api{API}.txt').write_text((root.stdout or '')+(root.stderr or ''))
            assert root.returncode==0, root.stderr
            run('adb','wait-for-device')
            set_tz=run('adb','shell','setprop','persist.sys.timezone','Pacific/Kiritimati',check=False)
            assert set_tz.returncode==0, set_tz.stderr
            actual=adb('shell','getprop','persist.sys.timezone')
            assert actual=='Pacific/Kiritimati', actual
            run('adb','logcat','-c',check=False)
            run('adb','shell','am','force-stop',PACKAGE)
            start()
            ws=connect(); ready(ws)
            after=evaluate(ws,'''(()=>{
              const current=currentOrNextOccurrence(),next=nextOccurrence();
              selectedDate=window.miaadCivilDate(%s);renderWeekView();
              const id='upcoming:'+%s+'__s2-runtime-next';
              const reminder=buildNativeReminders(2).find(x=>x.id===id);
              syncNativeReminders();
              return {teacherZone:domain.teacherZone(),teacherDate:domain.teacherNow().date,bridgeToday:dateKey(new Date()),currentId:current&&current.lesson.id,currentInProgress:!!current?.inProgress,nextId:next&&next.lesson.id,calendar:dateKey(selectedDate),calendarButton:!!document.querySelector('[data-calendar-date="'+%s+'"]'),reminderAt:reminder&&reminder.at,expected:+domain.resolveWallClock(%s,'12:34'),deviceZone:Intl.DateTimeFormat().resolvedOptions().timeZone};
            })()''' % tuple(json.dumps(before['tomorrow']) for _ in range(4)))
            ws.close()
            assert after['teacherZone']=='Pacific/Honolulu', after
            assert after['deviceZone']=='Pacific/Kiritimati', after
            assert after['teacherDate']==before['teacherDate'], (before,after)
            assert after['bridgeToday']==after['teacherDate'], after
            assert after['currentId']=='s2-runtime-current' and after['currentInProgress'], after
            assert after['nextId']=='s2-runtime-current', after
            assert after['calendar']==before['tomorrow'] and after['calendarButton'], after
            assert after['reminderAt']==before['reminderAt']==after['expected']-20*60000, (before,after)
            alarms=adb('shell','dumpsys','alarm')
            assert PACKAGE in alarms, 'native alarms missing after temporal probe'
            logs=adb('logcat','-d')
            (OUT/f's2-temporal-logcat-api{API}.txt').write_text(logs)
            assert 'FATAL EXCEPTION' not in logs
            assert 'E MiaadWeb' not in logs
            evidence={'api':API,'systemTimeZoneProperty':actual,'before':before,'after':after,'nativeAlarmRegistration':True,'result':'PASS'}
            (OUT/f's2-temporal-runtime-api{API}.json').write_text(json.dumps(evidence,indent=2))
            print(f'Slice-2 temporal runtime authority on API {API}: PASS')
            PY
            python3 /tmp/miaad-s2-temporal-runtime.py

      - name: Upload API ${{ matrix.api }} runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1b-s2-runtime-api-${{ matrix.api }}
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

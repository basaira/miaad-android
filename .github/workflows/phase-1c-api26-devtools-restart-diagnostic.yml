name: Phase 1C API26 Post-Restart DevTools CDP Transport Diagnostic V2
on:
  push:
    branches:
      - 'miaad/phase-1c-occurrence-authority-api26-devtools-restart-diagnostic-v2'
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_SHA: 6a3b367e4f0a9d007846452b9343733ff3adf086
  CANDIDATE_TREE: 92558e4b3859baf71c3eaec4de26d1436e921eec
  OFFICIAL_SHA: ca703d82a9a500393a0ce8948b279488f8e6c517
  MAIN_SHA: 16477b29106d59d0e1fe7d4e99c63b55d6d97327
  V1R6R1_SHA: 41dcbc63b9ef4e593a4c86007f08a814d8a974b9
  HISTORICAL_DIAG_V1_SHA: 212e09a5224cad98abdbce2aaacf93a3533a01ce
  HISTORICAL_RUN_ID: '36883132911'
  HISTORICAL_ARTIFACT_ID: '11173705606'
  HISTORICAL_ARTIFACT_NAME: miaad-phase-1c-occurrence-authority-v1r6r1-apk
  HISTORICAL_ARTIFACT_DIGEST: sha256:11399c68aa6712e5e6d8c3fd16e26b5f463f2c021993eeb8c831f6f4a1c4940c
  RAW_APK_SHA256: 98a241d64483dc6cf656100da575e17ca6a756769d5ee20213aa695c4b5e6015
  RAW_APK_SIZE: '12821115'
  WORKFLOW_PATH: .github/workflows/phase-1c-api26-devtools-restart-diagnostic.yml
jobs:
  preflight:
    name: Frozen identity and historical APK preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove workflow-only topology and frozen refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD | wc -l)" -eq 1
          git diff --name-only "$CANDIDATE_SHA" HEAD | grep -Fxq "$WORKFLOW_PATH"
          check(){ ref="$1"; expected="$2"; got="$(git ls-remote origin "refs/heads/$ref" | awk '{print $1}')"; test "$got" = "$expected"; }
          check miaad/phase-1c-occurrence-authority-candidate "$CANDIDATE_SHA"
          check miaad/phase-1-correctness "$OFFICIAL_SHA"
          check main "$MAIN_SHA"
          check miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r1 "$V1R6R1_SHA"
          check miaad/phase-1c-occurrence-authority-api26-runtime-diagnostic-v1 "$HISTORICAL_DIAG_V1_SHA"
          echo 'V2 FROZEN REF PREFLIGHT PASS'
      - name: Verify historical artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_ARTIFACT_ID" > artifact-meta.json
          test "$(jq -r .name artifact-meta.json)" = "$HISTORICAL_ARTIFACT_NAME"
          test "$(jq -r .digest artifact-meta.json)" = "$HISTORICAL_ARTIFACT_DIGEST"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.HISTORICAL_ARTIFACT_NAME }}
          path: historical-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}
      - name: Verify raw APK identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum historical-apk/app-debug.apk | awk '{print $1}')" = "$RAW_APK_SHA256"
          test "$(stat -c '%s' historical-apk/app-debug.apk)" = "$RAW_APK_SIZE"
          echo 'HISTORICAL RAW APK IDENTITY PASS'

  api26-attempt:
    name: API26 DevTools restart diagnostic attempt ${{ matrix.attempt }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    env:
      MIAAD_ATTEMPT: ${{ matrix.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert workflow-only identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          git diff --name-only "$CANDIDATE_SHA" HEAD > audit/diagnostic-paths.txt
          test "$(wc -l < audit/diagnostic-paths.txt)" -eq 1
          grep -Fxq "$WORKFLOW_PATH" audit/diagnostic-paths.txt
      - name: Install websocket client
        run: python3 -m pip install websocket-client==1.8.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.HISTORICAL_ARTIFACT_NAME }}
          path: historical-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}
      - name: Reverify exact APK before emulator
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum historical-apk/app-debug.apk | awk '{print $1}')"; size="$(stat -c '%s' historical-apk/app-debug.apk)"
          printf 'raw_apk_sha256=%s\nraw_apk_size=%s\npackage=com.miaad.app\nversionName=1.2.0\nversionCode=5\n' "$sha" "$size" | tee audit/apk-identity.txt
          test "$sha" = "$RAW_APK_SHA256"; test "$size" = "$RAW_APK_SIZE"
      - name: Build one-shot pre-restart semantic setup
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/emulator_occurrence_authority_review.py "$RUNNER_TEMP/api26_occurrence_one_shot_setup.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'api26_occurrence_one_shot_setup.py'
          s=p.read_text(encoding='utf-8')
          marker='adb("shell","am","force-stop",PACKAGE)'
          if s.count(marker)!=1:
              raise SystemExit(f'Expected exactly one force-stop marker, found {s.count(marker)}')
          s=s.replace(marker,'print("V2 PRE-RESTART STATE COMPLETE"); raise SystemExit(0)',1)
          if 'canonical-runtime-note' not in s or 'real-runtime-note' not in s:
              raise SystemExit('Candidate one-shot semantic setup identity not found')
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile "$RUNNER_TEMP/api26_occurrence_one_shot_setup.py"
          grep -Fq 'V2 PRE-RESTART STATE COMPLETE' "$RUNNER_TEMP/api26_occurrence_one_shot_setup.py"
          grep -Fq 'canonical-runtime-note' "$RUNNER_TEMP/api26_occurrence_one_shot_setup.py"
          grep -Fq 'real-runtime-note' "$RUNNER_TEMP/api26_occurrence_one_shot_setup.py"
      - name: Build V2 post-restart DevTools probe
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/api26_devtools_restart_v2.py"
          python3 -m py_compile "$RUNNER_TEMP/api26_devtools_restart_v2.py"
          grep -Fq 'Page.getFrameTree' "$RUNNER_TEMP/api26_devtools_restart_v2.py"
          grep -Fq 'Runtime.enable' "$RUNNER_TEMP/api26_devtools_restart_v2.py"
          grep -Fq 'trueReadinessWindowSeconds' "$RUNNER_TEMP/api26_devtools_restart_v2.py"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Ensure platform tools and KVM
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare API26 V2 runtime script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/miaad-api26-devtools-v2.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p audit
          APK="$GITHUB_WORKSPACE/historical-apk/app-debug.apk"
          REAL_ADB="$(command -v adb)"; export REAL_ADB
          { echo "attempt=$MIAAD_ATTEMPT"; adb version || true; emulator -version || true; echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d $'\r')"; echo "fingerprint=$(adb shell getprop ro.build.fingerprint | tr -d $'\r')"; adb shell cmd webviewupdate getCurrentWebViewPackage || true; adb shell dumpsys webviewupdate || true; adb shell dumpsys package com.android.chrome | grep -E 'versionName=|versionCode=' | head -n 8 || true; } | tee audit/api26-environment.txt
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$RAW_APK_SHA256"
          test "$(stat -c '%s' "$APK")" = "$RAW_APK_SIZE"
          adb install -r "$APK" | tee audit/apk-install.txt
          grep -Fxq 'Success' audit/apk-install.txt
          adb root; adb wait-for-device
          adb shell svc wifi disable; adb shell svc data disable
          adb logcat -c || true
          adb shell am force-stop com.miaad.app
          adb shell am start -W -n com.miaad.app/.MainActivity | tee audit/am-start-api26.txt
          ready=false
          for n in $(seq 1 40); do if adb logcat -d -s MiaadStartup:I '*:S' | grep -q 'content-ready'; then ready=true; break; fi; sleep 2; done
          test "$ready" = true
          adb exec-out screencap -p > "audit/miaad-first-frame-attempt-$MIAAD_ATTEMPT.png" || true
          # Keep the setup path minimal: this task diagnoses restart transport,
          # not baseline acceptance. Clear any inherited forward before staging.
          adb forward --remove-all || true
          set +e
          MIAAD_API_LEVEL=26 MIAAD_ATTEMPT="$MIAAD_ATTEMPT" python3 "$RUNNER_TEMP/api26_occurrence_one_shot_setup.py" 2>&1 | tee audit/pre-restart-semantic-probe.txt
          setup_rc=${PIPESTATUS[0]}
          set -e
          adb forward --remove tcp:9222 || true
          SETUP_RC="$setup_rc" python3 - <<'PY'
          import json,os
          from pathlib import Path
          log=Path('audit/pre-restart-semantic-probe.txt').read_text(encoding='utf-8',errors='replace')
          rc=int(os.environ['SETUP_RC'])
          if 'V2 PRE-RESTART STATE COMPLETE' in log:
              status='COMPLETED'
          elif 'exceptionDetails' in log:
              status='SEMANTIC_EXCEPTION'
          elif any(x in log for x in ('WebSocketTimeoutException','timed out','RUNTIME UNRESPONSIVE','runtime did not become ready')):
              status='RESPONSE_LOST_OR_RUNTIME_UNAVAILABLE'
          else:
              status='FAILED_UNKNOWN'
          out={'attempt':int(os.environ['MIAAD_ATTEMPT']),'exitCode':rc,'status':status,'mutationRepeated':False}
          Path('audit/pre-restart-setup-status.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
          cat > "$RUNNER_TEMP/pre_restart_read.py" <<'PY'
          import json,os,re,subprocess,time,urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          import websocket

          A=Path('audit'); A.mkdir(exist_ok=True)
          N=int(os.environ['MIAAD_ATTEMPT']); ADB=os.environ['REAL_ADB']; PKG='com.miaad.app'
          setup=json.loads((A/'pre-restart-setup-status.json').read_text())
          samples=[]
          def run(*args,t=20):
              return subprocess.run([ADB,*args],text=True,capture_output=True,timeout=t)
          def pid():
              p=run('shell','pidof',PKG,t=10); s=(p.stdout or '').strip().replace('\r','')
              return s.split()[0] if s else None
          def http_json(port,path):
              x=time.monotonic()
              try:
                  with urllib.request.urlopen(f'http://127.0.0.1:{port}{path}',timeout=4) as r:
                      return {'ok':True,'latencyMs':round((time.monotonic()-x)*1000,1),'data':json.loads(r.read().decode())}
              except Exception as e:
                  return {'ok':False,'latencyMs':round((time.monotonic()-x)*1000,1),'error':repr(e)}
          def choose(items):
              pages=[x for x in (items if isinstance(items,list) else []) if x.get('type')=='page' and x.get('webSocketDebuggerUrl')]
              assets=[x for x in pages if 'android_asset' in str(x.get('url',''))]
              return (assets or [None])[0]
          def mapped_ws(target,port):
              p=urlparse(target['webSocketDebuggerUrl'])
              return f'ws://127.0.0.1:{port}{p.path}'+(('?'+p.query) if p.query else '')
          expr="""(function(){
            var today=domain.teacherNow().date;
            var row=domain.resolveScheduleOccurrence('runtime-occ-c1',today);
            var c1id=row?row.id:null;
            var realId=today+'__runtime-occ-real';
            var c1=c1id?domain.data.records[c1id]:null;
            var real=domain.data.records[realId];
            var rec=Object.keys(domain.data.records||{}).filter(function(k){return k.indexOf('__runtime-occ-')>=0}).sort();
            var sch=Object.keys(domain.data.schedules||{}).filter(function(k){return k.indexOf('runtime-occ-')===0}).sort();
            var ss=Object.keys(sessionState||{}).filter(function(k){return k.indexOf('runtime-occ')>=0}).sort();
            var sn=Object.keys(sessionNotes||{}).filter(function(k){return k.indexOf('runtime-occ')>=0}).sort();
            return {
              today:today,c1id:c1id,realId:realId,
              c1:c1?{status:c1.status,note:c1.note,actualMinutes:c1.actualMinutes,countOverride:c1.countOverride}:null,
              c2:real?{status:real.status,note:real.note}:null,
              records:rec,schedules:sch,sessionState:ss,sessionNotes:sn,
              invalidRecordKeys:rec.filter(function(k){return k.indexOf('__runtime-occ-invalid-')>=0}),
              invalidScheduleKeys:sch.filter(function(k){return k==='runtime-occ-invalid-weekday'||k==='runtime-occ-invalid-phase'}),
              invalidStateKeys:ss.filter(function(k){return k.indexOf('runtime-occ-invalid-')>=0}),
              invalidNoteKeys:sn.filter(function(k){return k.indexOf('runtime-occ-invalid-')>=0})
            };
          })()"""
          state=None; deadline=time.monotonic()+60
          while time.monotonic()<deadline and state is None:
              port=None; ws=None; row={'timestamp':time.time()}
              try:
                  p=pid(); row['pid']=p
                  if not p: row['error']='process missing'; samples.append(row); break
                  q=run('forward','tcp:0',f'localabstract:webview_devtools_remote_{p}',t=15)
                  m=re.search(r'(\d+)',(q.stdout or '').strip())
                  if q.returncode or not m: row['error']='forward failed'; row['stderr']=q.stderr; samples.append(row); time.sleep(1); continue
                  port=int(m.group(1)); row['port']=port
                  li=http_json(port,'/json/list'); row['jsonList']={k:v for k,v in li.items() if k!='data'}
                  t=choose(li.get('data')) if li.get('ok') else None
                  if not t: row['error']='target missing'; samples.append(row); time.sleep(1); continue
                  row['target']={k:t.get(k) for k in ('id','type','url','title','webSocketDebuggerUrl')}
                  ws=websocket.create_connection(mapped_ws(t,port),timeout=5)
                  ws.settimeout(5); ws.send(json.dumps({'id':1,'method':'Runtime.enable','params':{}}))
                  while True:
                      z=json.loads(ws.recv())
                      if z.get('id')==1: break
                  ws.send(json.dumps({'id':2,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':False}}))
                  while True:
                      z=json.loads(ws.recv())
                      if z.get('id')==2: break
                  rr=z.get('result') or {}
                  if z.get('error') or rr.get('exceptionDetails'): row['error']='evaluation failure'; row['response']=z
                  else:
                      state=(rr.get('result') or {}).get('value'); row['state']=state
                  samples.append(row)
              except Exception as e:
                  row['exception']=repr(e); samples.append(row)
              finally:
                  try:
                      if ws: ws.close()
                  except Exception: pass
                  if port is not None: run('forward','--remove',f'tcp:{port}',t=10)
              if state is None: time.sleep(1)

          (A/'pre-restart-read-samples.json').write_text(json.dumps(samples,indent=2),encoding='utf-8')
          if state is None:
              out={'attempt':N,'case':'PRE_RESTART_READ_INFRASTRUCTURE','classification':'INCONCLUSIVE — PRE-RESTART CDP VERIFICATION INFRASTRUCTURE','firstFailingLayer':'pre-restart read-only verification','samples':samples}
              (A/'api26-v2-attempt-result.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); (A/'pre-restart-stop').write_text('1'); print(json.dumps(out,indent=2)); raise SystemExit(0)

          ok=(state.get('c1id') and state.get('realId') and
              isinstance(state.get('c1'),dict) and state['c1'].get('status')=='entered' and state['c1'].get('note')=='canonical-runtime-note' and state['c1'].get('actualMinutes')==23 and state['c1'].get('countOverride') is False and
              isinstance(state.get('c2'),dict) and state['c2'].get('status')=='entered' and state['c2'].get('note')=='real-runtime-note' and
              state.get('invalidRecordKeys')==[] and state.get('invalidScheduleKeys')==[] and state.get('invalidStateKeys')==[] and state.get('invalidNoteKeys')==[])
          if not ok:
              proven=setup.get('status') in ('COMPLETED','SEMANTIC_EXCEPTION')
              out={
                'attempt':N,
                'case':'PRE_RESTART_SEMANTIC_FAILURE' if proven else 'PRE_RESTART_SETUP_UNPROVEN',
                'classification':'Production Bug' if proven else 'INCONCLUSIVE — PRE-RESTART ONE-SHOT SETUP RESPONSE LOST / STATE INCOMPLETE',
                'firstFailingLayer':'pre-restart semantic assertion' if proven else 'pre-restart one-shot setup / read-only verification',
                'preRestartState':state,
                'oneShotSetupStatus':setup
              }
              (A/'api26-v2-attempt-result.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); (A/'pre-restart-stop').write_text('1'); print(json.dumps(out,indent=2)); raise SystemExit(0)

          pre={
            'pass':True,
            'oneShotSetupStatus':setup,
            'mutationRepeated':False,
            'preRestartStages':{
              'C1-A':{'projectionId':state['c1id']},
              'C1-D':state['c1'],
              'C2-A':{'recordId':state['realId'],'status':state['c2']['status'],'note':state['c2']['note']},
              'C2-B':{'scheduleExists':False,'recordExists':False,'sessionStateExists':False,'sessionNotesExists':False},
              'C2-D':{'scheduleExists':False,'recordExists':False,'mirrorState':None,'mirrorNote':None},
              'COMMIT':{'c1Status':state['c1']['status'],'realStatus':state['c2']['status'],'invalidWeekdayRecord':False,'invalidPhaseRecord':False}
            },
            'independentReadOnlyState':state
          }
          (A/'pre-restart-semantic.json').write_text(json.dumps(pre,indent=2),encoding='utf-8')
          print('PRE-RESTART PHASE 1C SEMANTIC STATE PASS')
          PY

          REAL_ADB="$REAL_ADB" MIAAD_ATTEMPT="$MIAAD_ATTEMPT" python3 "$RUNNER_TEMP/pre_restart_read.py" | tee audit/pre-restart-read.txt
          if [ -f audit/pre-restart-stop ]; then exit 0; fi
          REAL_ADB="$REAL_ADB" MIAAD_ATTEMPT="$MIAAD_ATTEMPT" python3 "$RUNNER_TEMP/api26_devtools_restart_v2.py" | tee audit/v2-console.txt
          test -s audit/api26-v2-attempt-result.json
          BASH
          chmod +x /tmp/miaad-api26-devtools-v2.sh
          bash -n /tmp/miaad-api26-devtools-v2.sh
      - name: Run fresh API26 V2 attempt ${{ matrix.attempt }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash /tmp/miaad-api26-devtools-v2.sh
      - name: Summarize attempt
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s audit/api26-v2-attempt-result.json ]; then jq . audit/api26-v2-attempt-result.json | tee audit/attempt-summary.txt; else printf '{"attempt":%s,"classification":"INCONCLUSIVE — EVIDENCE REQUIRED","reason":"result missing"}\n' "$MIAAD_ATTEMPT" | tee audit/api26-v2-attempt-result.json audit/attempt-summary.txt; fi
      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-api26-devtools-restart-diagnostic-v2-attempt-${{ matrix.attempt }}
          path: audit/
          if-no-files-found: error
          retention-days: 30

  classify:
    name: Classify API26 DevTools restart diagnostic V2
    if: always()
    needs: [preflight, api26-attempt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: miaad-phase-1c-api26-devtools-restart-diagnostic-v2-attempt-*
          path: attempt-artifacts
      - name: Cross-attempt classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json
          from pathlib import Path
          rs=[json.loads(Path(p).read_text()) for p in glob.glob('attempt-artifacts/**/api26-v2-attempt-result.json',recursive=True)];rs.sort(key=lambda x:x.get('attempt',0))
          product=[r for r in rs if r.get('classification') in ('Production Bug','Production / Android Runtime Bug')]
          full=[r for r in rs if r.get('classification')=='FULL PASS']
          def infra(r):
              s=str(r.get('classification','')).upper()
              return any(x in s for x in ('INFRASTRUCTURE','STALL','FLAKE','TARGET CHURN'))
          if len(rs)==3 and len(full)==3:opening='PHASE 1C API26 POST-RESTART DIAGNOSTIC PASS — HISTORICAL FAILURE NOT REPRODUCED — NO CANDIDATE MUTATION';final='TEST / RUNTIME VERIFICATION HARNESS — historical post-restart failure not reproduced'
          elif product:opening='PHASE 1C API26 POST-RESTART PRODUCT ISSUE CONFIRMED — NO CANDIDATE MUTATION';final='Production Bug'
          elif len(rs)==3 and all(infra(r) or r in full for r in rs):opening='PHASE 1C API26 POST-RESTART DEVTOOLS INFRASTRUCTURE CONFIRMED — NO CANDIDATE MUTATION';final='ANDROID API26 DEVTOOLS / RUNTIME VERIFICATION INFRASTRUCTURE'
          else:opening='PHASE 1C API26 POST-RESTART DIAGNOSIS INCONCLUSIVE — NO CANDIDATE MUTATION';final='INCONCLUSIVE — EVIDENCE REQUIRED'
          out={'opening':opening,'finalRootCauseClass':final,'attempts':rs};Path('v2-final-classification.json').write_text(json.dumps(out,indent=2));print(opening);print('FINAL ROOT-CAUSE CLASS = '+final)
          for r in rs:print('ATTEMPT',r.get('attempt'),'case=',r.get('case'),'classification=',r.get('classification'),'firstLayer=',r.get('firstFailingLayer'),'semantic=',(r.get('semanticState') or {}).get('pass'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-api26-devtools-restart-diagnostic-v2-classification
          path: v2-final-classification.json

  post-run-immutability:
    name: Post-run immutability V2
    if: always()
    needs: [api26-attempt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen refs unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          check(){ ref="$1"; expected="$2"; got="$(git ls-remote origin "refs/heads/$ref" | awk '{print $1}')"; test "$got" = "$expected"; }
          check miaad/phase-1c-occurrence-authority-candidate "$CANDIDATE_SHA"
          check miaad/phase-1-correctness "$OFFICIAL_SHA"
          check main "$MAIN_SHA"
          check miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r1 "$V1R6R1_SHA"
          check miaad/phase-1c-occurrence-authority-api26-runtime-diagnostic-v1 "$HISTORICAL_DIAG_V1_SHA"

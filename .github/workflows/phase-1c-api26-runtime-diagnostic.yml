name: Phase 1C API26 Installed Runtime Occurrence Authority Staged Diagnostic V1

on:
  push:
    branches:
      - 'miaad/phase-1c-occurrence-authority-api26-runtime-diagnostic-v1'

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: 6a3b367e4f0a9d007846452b9343733ff3adf086
  CANDIDATE_TREE: 92558e4b3859baf71c3eaec4de26d1436e921eec
  OFFICIAL_SHA: ca703d82a9a500393a0ce8948b279488f8e6c517
  MAIN_SHA: 16477b29106d59d0e1fe7d4e99c63b55d6d97327
  V1R6R1_SHA: 41dcbc63b9ef4e593a4c86007f08a814d8a974b9
  HISTORICAL_RUN_ID: '36883132911'
  HISTORICAL_ARTIFACT_ID: '11173705606'
  HISTORICAL_ARTIFACT_NAME: miaad-phase-1c-occurrence-authority-v1r6r1-apk
  HISTORICAL_ARTIFACT_DIGEST: sha256:11399c68aa6712e5e6d8c3fd16e26b5f463f2c021993eeb8c831f6f4a1c4940c
  RAW_APK_SHA256: 98a241d64483dc6cf656100da575e17ca6a756769d5ee20213aa695c4b5e6015
  RAW_APK_SIZE: '12821115'
  WORKFLOW_PATH: .github/workflows/phase-1c-api26-runtime-diagnostic.yml

jobs:
  preflight:
    name: Historical identity and APK preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove branch topology and frozen refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD | wc -l)" -eq 1
          git diff --name-only "$CANDIDATE_SHA" HEAD | grep -Fxq "$WORKFLOW_PATH"
          check(){ ref="$1"; expected="$2"; got="$(git ls-remote origin "refs/heads/$ref" | awk '{print $1}')"; test "$got" = "$expected"; echo "$ref=$got"; }
          check miaad/phase-1c-occurrence-authority-candidate "$CANDIDATE_SHA"
          check miaad/phase-1-correctness "$OFFICIAL_SHA"
          check main "$MAIN_SHA"
          check miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r1 "$V1R6R1_SHA"
          echo 'DIAGNOSTIC WORKFLOW-ONLY TOPOLOGY PASS'

      - name: Verify historical artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$HISTORICAL_ARTIFACT_ID" > artifact-meta.json
          test "$(jq -r .name artifact-meta.json)" = "$HISTORICAL_ARTIFACT_NAME"
          test "$(jq -r .digest artifact-meta.json)" = "$HISTORICAL_ARTIFACT_DIGEST"
          jq '{id,name,digest,size_in_bytes}' artifact-meta.json
          echo 'HISTORICAL ARTIFACT METADATA PASS'

      - name: Download exact historical V1R6R1 APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HISTORICAL_ARTIFACT_NAME }}
          path: historical-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}

      - name: Verify raw APK identity
        shell: bash
        run: |
          set -euo pipefail
          test -f historical-apk/app-debug.apk
          actual_sha="$(sha256sum historical-apk/app-debug.apk | awk '{print $1}')"
          actual_size="$(stat -c '%s' historical-apk/app-debug.apk)"
          echo "raw_apk_sha256=$actual_sha"
          echo "raw_apk_size=$actual_size"
          test "$actual_sha" = "$RAW_APK_SHA256"
          test "$actual_size" = "$RAW_APK_SIZE"
          echo 'HISTORICAL RAW APK IDENTITY PASS'

  api26-attempt:
    name: API26 staged diagnostic attempt ${{ matrix.attempt }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    env:
      MIAAD_API_LEVEL: '26'
      MIAAD_ATTEMPT: ${{ matrix.attempt }}
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert workflow-only source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          git diff --name-only "$CANDIDATE_SHA" HEAD > audit/diagnostic-paths.txt
          test "$(wc -l < audit/diagnostic-paths.txt)" -eq 1
          grep -Fxq "$WORKFLOW_PATH" audit/diagnostic-paths.txt

      - name: Install runtime diagnostic dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install websocket-client==1.8.0

      - name: Download exact historical V1R6R1 APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HISTORICAL_ARTIFACT_NAME }}
          path: historical-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}

      - name: Reverify exact APK before emulator
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(sha256sum historical-apk/app-debug.apk | awk '{print $1}')"
          actual_size="$(stat -c '%s' historical-apk/app-debug.apk)"
          printf 'artifact_id=%s\nartifact_name=%s\nartifact_zip_digest=%s\nraw_apk_sha256=%s\nraw_apk_size=%s\npackage=%s\nversionName=%s\nversionCode=%s\n' "$HISTORICAL_ARTIFACT_ID" "$HISTORICAL_ARTIFACT_NAME" "$HISTORICAL_ARTIFACT_DIGEST" "$actual_sha" "$actual_size" 'com.miaad.app' '1.2.0' '5' | tee audit/apk-identity.txt
          test "$actual_sha" = "$RAW_APK_SHA256"
          test "$actual_size" = "$RAW_APK_SIZE"

      - name: Build temporary staged probe
        shell: bash
        run: |
          set -euo pipefail
          cat <<'B64' | tr -d '\n' | base64 -d | gzip -dc > "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py"
          
          
          
          
          
          
          
          
          
          B64
          python3 - <<'PY'
          import re, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"api26_occurrence_staged_diagnostic.py"
          s=p.read_text(encoding="utf-8")
          original=s
          s=re.sub(r"document\.querySelector\(([^\n;]+?)\)\?\.dataset\.state",
                   r"(function(){var __b=document.querySelector(\1);return __b?__b.dataset.state:null})()",s)
          s=re.sub(r"document\.getElementById\(([^\n;]+?)\)\?\.value",
                   r"(function(){var __e=document.getElementById(\1);return __e?__e.value:null})()",s)
          replacements={
            "!!domain?.data?.students?.['occ-authority-runtime']":"!!(domain&&domain.data&&domain.data.students&&domain.data.students['occ-authority-runtime'])",
            "!!domain?.data?.schedules?.['runtime-occ-c1']":"!!(domain&&domain.data&&domain.data.schedules&&domain.data.schedules['runtime-occ-c1'])",
            "document.querySelector('#sessionStatePicker button.active')?.dataset?.state||null":"(function(){var __b=document.querySelector('#sessionStatePicker button.active');return (__b&&__b.dataset)?__b.dataset.state:null})()",
            "(function(){var __e=document.getElementById('fSessionNote');return __e?__e.value:null})()??null":"(function(){var __e=document.getElementById('fSessionNote');return __e?__e.value:null})()"
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          schedule_old_a="r=d.c1id&&domain.data.records[d.c1id],s=domain.data.schedules['runtime-occ-c1']"
          schedule_new_a="r=d.c1id&&domain.data.records[d.c1id],vs=domain.data.schedules['runtime-occ-c1']||[],s=vs.length?vs[vs.length-1].lesson:null"
          schedule_old_b="r=domain.data.records[d.c1id],s=domain.data.schedules['runtime-occ-c1']"
          schedule_new_b="r=domain.data.records[d.c1id],vs=domain.data.schedules['runtime-occ-c1']||[],s=vs.length?vs[vs.length-1].lesson:null"
          if s.count(schedule_old_a)!=1:
              raise SystemExit(f"Expected one read-only C1-D schedule readback, found {s.count(schedule_old_a)}")
          if s.count(schedule_old_b)!=1:
              raise SystemExit(f"Expected one mutating C1-D schedule readback, found {s.count(schedule_old_b)}")
          s=s.replace(schedule_old_a,schedule_new_a)
          s=s.replace(schedule_old_b,schedule_new_b)
          evidence_old="reminder:s&&s.reminder,version:domain.data.version"
          evidence_new="reminder:s&&s.reminder,version:domain.data.version,scheduleVersionCount:vs.length"
          if s.count(evidence_old)!=2:
              raise SystemExit(f"Expected two C1-D evidence objects, found {s.count(evidence_old)}")
          s=s.replace(evidence_old,evidence_new)
          s=re.sub(r"sessionState\[([^\]]+)\]\?\?null",
                   r"(sessionState[\1]===undefined?null:sessionState[\1])",s)
          s=re.sub(r"sessionNotes\[([^\]]+)\]\?\?null",
                   r"(sessionNotes[\1]===undefined?null:sessionNotes[\1])",s)
          restart_old='v,ws,ok=run_stage(ws,"RESTART-R0",READY_EXPR,validator=False)'
          restart_new='try:\n            wait_runtime_ready(ws,"RESTART-R0",timeout_total=60)\n            v=True; ok=True\n        except StageTimeout:\n            try: ws.close()\n            except Exception: pass\n            alive=process_pid() is not None\n            capture_logcat("timeout-RESTART-R0")\n            if not alive:\n                print("STAGE TIMEOUT — ACTION NOT COMPLETED")\n                return False,{"stage":"RESTART-R0","recovery":"ACTION NOT COMPLETED"}\n            try:\n                ws=connect(45)\n                v=evaluate_stage(ws,"RESTART-R0-RECOVERY",READY_EXPR,timeout=15)\n                if v is True:\n                    print("STAGE TIMEOUT — ACTION COMPLETED / RESPONSE LOST")\n                    ok=True\n                else:\n                    print("STAGE TIMEOUT — ACTION PARTIALLY COMPLETED")\n                    return False,{"stage":"RESTART-R0","recovery":"ACTION PARTIALLY COMPLETED","value":v}\n            except Exception as recovery_exc:\n                print("STAGE TIMEOUT — RUNTIME UNRESPONSIVE")\n                return False,{"stage":"RESTART-R0","recovery":"RUNTIME UNRESPONSIVE","exception":repr(recovery_exc)}'
          if s.count(restart_old)!=1:
              raise SystemExit(f"Expected one RESTART-R0 single-evaluate call, found {s.count(restart_old)}")
          s=s.replace(restart_old,restart_new)
          if "?." in s:
              print("UNSUPPORTED OPTIONAL CHAINING LOCATIONS:")
              for no,line in enumerate(s.splitlines(),1):
                  if "?." in line:
                      print(f"{no}: {line}")
              raise SystemExit("Unsupported optional chaining remains in staged API26 probe")
          if "??" in s:
              print("UNSUPPORTED NULLISH COALESCING LOCATIONS:")
              for no,line in enumerate(s.splitlines(),1):
                  if "??" in line:
                      print(f"{no}: {line}")
              raise SystemExit("Unsupported nullish coalescing remains in staged API26 probe")
          if s==original:
              raise SystemExit("Expected WebView69 staged-probe compatibility rewrite was not applied")
          p.write_text(s,encoding="utf-8")
          print("STAGED PROBE WEBVIEW69 SYNTAX COMPATIBILITY REWRITE PASS")
          PY
          python3 -m py_compile "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py"
          grep -Fq 'ACTION COMPLETED / RESPONSE LOST' "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py"
          grep -Fq 'ACTION PARTIALLY COMPLETED' "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py"
          grep -Fq 'ACTION NOT COMPLETED' "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py"
          grep -Fq 'RUNTIME UNRESPONSIVE' "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py"

      - name: Prepare API26 runtime script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/miaad-api26-staged-diagnostic.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p audit
          APK="$GITHUB_WORKSPACE/historical-apk/app-debug.apk"
          ATTEMPT="$MIAAD_ATTEMPT"

          {
            echo "attempt=$ATTEMPT"
            adb version || true
            emulator -version || true
            echo "sdk=$(adb shell getprop ro.build.version.sdk | tr -d $'\r')"
            echo "fingerprint=$(adb shell getprop ro.build.fingerprint | tr -d $'\r')"
            echo '--- webviewupdate ---'
            adb shell dumpsys webviewupdate || true
            echo '--- current webview package ---'
            adb shell cmd webviewupdate getCurrentWebViewPackage || true
            echo '--- webview packages ---'
            adb shell pm list packages | grep -Ei 'webview|chrome' || true
            adb shell dumpsys package com.google.android.webview | grep -E 'versionName=|versionCode=' | head -n 8 || true
            adb shell dumpsys package com.android.chrome | grep -E 'versionName=|versionCode=' | head -n 8 || true
          } | tee audit/api26-environment.txt

          actual_sha="$(sha256sum "$APK" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$APK")"
          test "$actual_sha" = "$RAW_APK_SHA256"
          test "$actual_size" = "$RAW_APK_SIZE"
          adb install -r "$APK" | tee audit/apk-install.txt
          grep -Fxq 'Success' audit/apk-install.txt
          echo 'APK install = Success'

          adb root
          adb wait-for-device
          test "$(adb shell id -u | tr -d $'\r')" = '0'
          adb shell svc wifi disable
          adb shell svc data disable
          if ! adb logcat -c; then
            echo 'WARN: logcat clear unavailable on API26; fresh-emulator log preserved' | tee audit/logcat-clear-warning.txt
            adb logcat -d > audit/logcat-prelaunch-api26.txt || true
          fi
          adb shell am force-stop com.miaad.app
          adb shell am start -W -n com.miaad.app/.MainActivity | tee audit/am-start-api26.txt
          ready=false
          for n in $(seq 1 35); do
            if adb logcat -d -s MiaadStartup:I '*:S' | grep -q 'content-ready'; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          adb exec-out screencap -p > "audit/miaad-first-frame-attempt-${ATTEMPT}.png" || true
          adb logcat -d > audit/logcat-first-frame-api26.txt
          echo 'Offline Android API 26 first-frame handoff: PASS'

          MIAAD_API_LEVEL=26 python3 scripts/emulator_acceptance.py | tee audit/baseline-acceptance.txt
          grep -Fxq 'Native installed-APK UI + data acceptance on API 26: PASS' audit/baseline-acceptance.txt
          adb logcat -d > audit/logcat-before-staged-probe-api26.txt

          MIAAD_API_LEVEL=26 MIAAD_ATTEMPT="$ATTEMPT" python3 "$RUNNER_TEMP/api26_occurrence_staged_diagnostic.py" | tee audit/staged-diagnostic-console.txt
          test -s audit/api26-cdp-stage-results.json
          test -s audit/api26-attempt-result.json
          BASH
          chmod +x /tmp/miaad-api26-staged-diagnostic.sh
          bash -n /tmp/miaad-api26-staged-diagnostic.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Ensure platform tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools'
          adb version

      - name: Enable emulator KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run fresh API26 staged diagnostic attempt ${{ matrix.attempt }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash /tmp/miaad-api26-staged-diagnostic.sh

      - name: Summarize attempt
        if: always()
        shell: bash
        run: |
          set +e
          if [ -s audit/api26-attempt-result.json ]; then
            jq . audit/api26-attempt-result.json | tee audit/attempt-summary.txt
          else
            printf '{"attempt":%s,"finalResult":"INCOMPLETE","reason":"staged result missing"}\n' "$MIAAD_ATTEMPT" | tee audit/api26-attempt-result.json audit/attempt-summary.txt
          fi
          if [ -s audit/api26-cdp-stage-results.json ]; then jq '.[] | {stage,requestId,durationMs,responseReceived,webSocketTimeout,nonmatchingMessageCount}' audit/api26-cdp-stage-results.json | tee audit/stage-timings-summary.txt; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          rp=Path('audit/api26-attempt-result.json')
          tp=Path('audit/api26-cdp-stage-results.json')
          if rp.is_file() and tp.is_file():
              r=json.loads(rp.read_text())
              telemetry=json.loads(tp.read_text())
              timed=[x for x in telemetry if x.get('webSocketTimeout')]
              if timed:
                  r['firstTimeoutStage']=r.get('firstTimeoutStage') or timed[0].get('stage')
                  r['timeoutTelemetry']=timed
                  if r.get('finalResult')=='PASS':
                      r['finalResult']='PASS_WITH_TRANSPORT_TIMEOUT'
                  rp.write_text(json.dumps(r,indent=2))
                  print('TIMEOUT EVIDENCE NORMALIZED INTO ATTEMPT RESULT')
                  print(json.dumps({'finalResult':r.get('finalResult'),'firstTimeoutStage':r.get('firstTimeoutStage'),'timeoutCount':len(timed)},indent=2))
          PY

      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-api26-runtime-diagnostic-v1-attempt-${{ matrix.attempt }}
          path: audit/
          if-no-files-found: error
          retention-days: 30

  classify:
    name: Classify staged API26 diagnostic
    if: always()
    needs: [preflight, api26-attempt]
    runs-on: ubuntu-24.04
    steps:
      - name: Download both attempt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: miaad-phase-1c-api26-runtime-diagnostic-v1-attempt-*
          path: attempt-artifacts
          merge-multiple: false

      - name: Classify from evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,glob
          from pathlib import Path
          paths=sorted(glob.glob('attempt-artifacts/**/api26-attempt-result.json',recursive=True))
          results=[json.loads(Path(p).read_text()) for p in paths]
          results.sort(key=lambda x:x.get('attempt',0))
          print('attempt_results='+json.dumps(results,indent=2))
          classification='INCONCLUSIVE — EVIDENCE REQUIRED'
          opening='PHASE 1C API26 STAGED RUNTIME DIAGNOSTIC INCOMPLETE — NO CANDIDATE MUTATION'
          if len(results)==2:
              finals=[r.get('finalResult') for r in results]
              semantic=[r for r in results if r.get('finalResult') in ('SEMANTIC_FAILURE','LOGCAT_PRODUCT_FAILURE')]
              if semantic:
                  classification='Production Bug'
                  opening='PHASE 1C API26 RUNTIME PRODUCT ISSUE LOCATED — NO CANDIDATE MUTATION'
              elif finals==['PASS','PASS']:
                  classification='TEST / RUNTIME VERIFICATION HARNESS — monolithic Runtime.evaluate / DevTools response-time fragility on API26'
                  opening='PHASE 1C API26 STAGED RUNTIME DIAGNOSTIC PASS — MONOLITHIC PROBE FAILURE NOT REPRODUCED — NO CANDIDATE MUTATION'
              elif all(x in ('PASS','PASS_WITH_TRANSPORT_TIMEOUT') for x in finals) and any(x=='PASS_WITH_TRANSPORT_TIMEOUT' for x in finals):
                  classification='ANDROID RUNTIME / DEVTOOLS TRANSPORT INFRASTRUCTURE'
                  opening='PHASE 1C API26 DEVTOOLS TRANSPORT FAILURE CONFIRMED — NO CANDIDATE MUTATION'
              else:
                  stalls=[r for r in results if r.get('finalResult') in ('STAGE_STALL','RESTART_FAILURE')]
                  if len(stalls)==2 and stalls[0].get('firstFailureStage') and stalls[0].get('firstFailureStage')==stalls[1].get('firstFailureStage'):
                      classification='API26-SPECIFIC RUNTIME BEHAVIOR — PRODUCT INVESTIGATION REQUIRED'
                      opening='PHASE 1C API26 RUNTIME PRODUCT ISSUE LOCATED — NO CANDIDATE MUTATION'
          out={'opening':opening,'classification':classification,'attempts':results}
          Path('final-classification.json').write_text(json.dumps(out,indent=2))
          print(opening)
          print('FINAL ROOT-CAUSE CLASS = '+classification)
          for r in results:
              print(f"ATTEMPT {r.get('attempt')} result={r.get('finalResult')} firstTimeout={r.get('firstTimeoutStage')} firstFailure={r.get('firstFailureStage')} restart={(r.get('restart') or {}).get('pass')}")
          PY

  post-run-immutability:
    name: Post-run immutability diagnostic V1
    if: always()
    needs: [api26-attempt]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove frozen refs unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          check(){ ref="$1"; expected="$2"; got="$(git ls-remote origin "refs/heads/$ref" | awk '{print $1}')"; test "$got" = "$expected"; echo "$ref=$got"; }
          check miaad/phase-1c-occurrence-authority-candidate "$CANDIDATE_SHA"
          check miaad/phase-1-correctness "$OFFICIAL_SHA"
          check main "$MAIN_SHA"
          check miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r1 "$V1R6R1_SHA"
          echo 'POST-RUN IMMUTABILITY PASS'

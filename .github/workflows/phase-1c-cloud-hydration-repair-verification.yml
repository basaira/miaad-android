name: Phase 1C V1R7 Persistence, Native guard and lossless recovery

on:
  push:
    branches:
      - miaad/phase-1c-cloud-hydration-safety-repair-v1
      - miaad/phase-1c-cloud-hydration-safety-repair-v1r2
      - miaad/phase-1c-cloud-settings-hydration-repair-v1r3
      - miaad/phase-1c-cloud-boolean-settings-repair-v1r4
      - miaad/phase-1c-cloud-settings-contract-repair-v1r5
      - miaad/phase-1c-initial-hydration-safety-repair-v1r6
      - miaad/phase-1c-persistence-recovery-safety-v1r7
      - miaad/phase-1c-uid-ownership-safety-repair-v1r7r1

permissions:
  contents: read

jobs:
  targeted-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated candidate parent and change scope
        run: |
          test "$(git merge-base 01c2926cb3bfecce352bba33ced93d9c739726db HEAD)" = "01c2926cb3bfecce352bba33ced93d9c739726db"
          git diff --name-only 01c2926cb3bfecce352bba33ced93d9c739726db HEAD > /tmp/phase-1c-changed-paths.txt
          cat > /tmp/phase-1c-expected-paths.txt <<'EOF'
          .github/workflows/phase-1c-cloud-hydration-repair-verification.yml
          app/src/androidTest/java/com/miaad/app/NativeWriteBoundaryTest.java
          app/src/debug/AndroidManifest.xml
          app/src/debug/google-services.json
          app/src/debug/res/xml/miaad_emulator_network_security.xml
          app/src/main/assets/app-boot.js
          app/src/main/assets/app-core.js
          app/src/main/assets/app-engine.js
          app/src/main/assets/app-integration.js
          app/src/main/java/com/miaad/app/MainActivity.java
          app/src/main/java/com/miaad/app/MiaadBridge.java
          app/src/main/java/com/miaad/app/ReminderReceiver.java
          app/src/main/java/com/miaad/app/ReminderScheduler.java
          app/src/main/java/com/miaad/app/RestoreRemindersReceiver.java
          scripts/test-cloud-hydration.cjs
          scripts/test-firestore-rules.py
          scripts/test-occurrence-authority.cjs
          scripts/test-timezone-dst-contract.cjs
          scripts/test-uid-ownership.cjs
          EOF
          diff -u /tmp/phase-1c-expected-paths.txt /tmp/phase-1c-changed-paths.txt
          test ! -e app/build/generated/compatAssets
      - name: Install pinned verification dependencies
        run: |
          python3 -m pip install Pillow==11.3.0 androguard==4.1.3
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3 esbuild@0.28.2 acorn@8.18.0 @esbuild/linux-x64@0.28.2
          node scripts/verify-compat-toolchain.cjs
      - name: Source receiver, domain and compatibility gates
        run: |
          python3 scripts/audit_brand.py
          node scripts/test-cloud-hydration.cjs
          node scripts/test-initial-hydration.cjs
          node scripts/test-persistence-recovery.cjs
          node scripts/test-uid-ownership.cjs
          node scripts/test-occurrence-authority.cjs
          node scripts/test-scheduling-contract.cjs
          node scripts/test-timezone-dst-contract.cjs
          node scripts/test-compat-shims.cjs
          node scripts/test-schedule.cjs
          node scripts/test-domain.cjs
          node scripts/test-quality-invariants.cjs
          node scripts/test-webview-harness-compat.cjs
          node scripts/audit-js-compat.cjs
      - name: Source real UI and report flows
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          node scripts/test-initial-browser.cjs
          node scripts/test-flows.cjs
          node scripts/test-flows.cjs  # independently repeat the prior intermittent reload assertion
          node scripts/test-browser.cjs
          node scripts/test-report-invariants.cjs
          node scripts/test-ui-standards.cjs
      - name: Generate and test WebView69 assets
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          node scripts/build-compat.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-shipping-compat.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-cloud-hydration.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-initial-hydration.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-persistence-recovery.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-uid-ownership.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-initial-browser.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-occurrence-authority.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-timezone-dst-contract.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-flows.cjs
          node scripts/compat-assets-manifest.cjs audit/cloud-repair-tested.json > audit/cloud-repair-tested.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Clean regeneration, lint, unit-test invocation and APK
        run: |
          rm -rf app/build
          gradle :app:generateCompatAssets --rerun-tasks --stacktrace
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-cloud-hydration.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-initial-hydration.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-persistence-recovery.cjs
          MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" node scripts/test-uid-ownership.cjs
          node scripts/compat-assets-manifest.cjs audit/cloud-repair-clean.json > audit/cloud-repair-clean.sha256
          cmp audit/cloud-repair-tested.sha256 audit/cloud-repair-clean.sha256
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          # A test build must use the demo Firebase project, never the live project's options.
          # Google Services Gradle task already executed in the successful Debug build.
          # AGP/plugin versions may relocate generated XML: validate the exact
          # variant source selected by the plugin instead of assuming its output path.
          python3 - <<'PY'
          import json
          from pathlib import Path
          debug=json.loads(Path("app/src/debug/google-services.json").read_text())
          production=json.loads(Path("app/google-services.json").read_text())
          assert debug["project_info"]["project_id"] == "demo-miaad-v1r7", "Debug Firebase project mismatch"
          assert debug["project_info"]["project_id"] != production["project_info"]["project_id"], "Production Firebase leaked into emulator fixture"
          assert any(c["client_info"]["android_client_info"]["package_name"] == "com.miaad.app"
                     for c in debug["client"]), "Debug Firebase package mismatch"
          print("PASS: Debug-specific demo Firebase configuration, separate from original release credentials")
          PY
          # The local Firebase emulators require cleartext on 10.0.2.2,
          # but the exception must never ship in release/production manifests.
          gradle :app:processReleaseMainManifest --stacktrace
          release_manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/release/*' -print -quit)"
          test -n "$release_manifest" && test -f "$release_manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$release_manifest"
          if grep -q 'networkSecurityConfig' "$release_manifest"; then echo "Release network policy unexpectedly overridden"; exit 1; fi
          test ! -f app/src/main/res/xml/miaad_emulator_network_security.xml
          node scripts/verify-apk-compat.cjs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > audit/cloud-repair-apk-sha256.txt
          stat -c '%s' app/build/outputs/apk/debug/app-debug.apk > audit/cloud-repair-apk-size.txt
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > audit/instrumentation-apk.sha256
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          app_cert="$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test_cert="$("$apksigner" verify --print-certs app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$app_cert" && test "$app_cert" = "$test_cert"
          printf 'MATCHED_SIGNER_SHA256=%s\n' "$app_cert" > audit/native-apk-signing.txt
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-initial-hydration-evidence
          path: audit/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload exact APK for installed runtime checks
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-built-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            audit/cloud-repair-apk-sha256.txt
            audit/cloud-repair-apk-size.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload paired Native instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-native-test-apk
          path: |
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            audit/instrumentation-apk.sha256
            audit/native-apk-signing.txt
          if-no-files-found: error
          retention-days: 90

  installed-apk-runtime:
    needs: targeted-verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-built-apk
          path: runtime
      - name: Verify downloaded build identity and prepare emulator
        run: |
          test -s runtime/app/build/outputs/apk/debug/app-debug.apk
          expected="$(cut -d' ' -f1 runtime/audit/cloud-repair-apk-sha256.txt)"
          test "$(sha256sum runtime/app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" = "$expected"
          test "$(stat -c '%s' runtime/app/build/outputs/apk/debug/app-debug.apk)" = "$(cat runtime/audit/cloud-repair-apk-size.txt)"
          sudo chmod 666 /dev/kvm
          mkdir -p audit
          cat > "$RUNNER_TEMP/check-installed-apk.sh" <<'SH'
          set -euo pipefail
          apk=runtime/app/build/outputs/apk/debug/app-debug.apk
          expected="$(cut -d' ' -f1 runtime/audit/cloud-repair-apk-sha256.txt)"
          # Preserve all AndroidRuntime diagnostics. Do not misattribute system
          # service crashes to MIAAD; reject every app-owned or unknown fatality.
          check_app_crashes() {
            python3 - "$1" <<'PY'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          blocking, external = [], []
          for index, line in enumerate(lines):
              if "AndroidRuntime: FATAL EXCEPTION" not in line and not (
                      "AndroidRuntime:" in line and " FATAL " in line):
                  continue
              owner = None
              for candidate in lines[index+1:index+7]:
                  if "AndroidRuntime: Process:" in candidate:
                      owner = candidate.split("AndroidRuntime: Process:", 1)[1].split(",", 1)[0].strip()
                      break
                  if "AndroidRuntime: FATAL EXCEPTION" in candidate:
                      break
              if not owner or owner == "com.miaad.app" or owner.startswith("com.miaad.app:"):
                  blocking.append((index + 1, owner or "UNATTRIBUTED"))
              else:
                  external.append((index + 1, owner))
          for line_no, owner in external:
              print(f"EXTERNAL Android fatal at log line {line_no}: {owner} (retained in evidence)")
          for line_no, owner in blocking:
              print(f"BLOCKING Android fatal at log line {line_no}: {owner}", file=sys.stderr)
          sys.exit(1 if blocking else 0)
          PY
          }
          adb wait-for-device
          adb install -r "$apk"
          if test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" -ge 33; then
            adb shell pm grant com.miaad.app android.permission.POST_NOTIFICATIONS
          fi
          adb shell am start -W -n com.miaad.app/.MainActivity --ez miaad_isolated_no_firebase true
          for attempt in $(seq 1 60); do
            adb logcat -d -s MiaadStartup:I MiaadWeb:E AndroidRuntime:E > audit/runtime-log.txt
            if grep -q 'MiaadStartup: content-ready' audit/runtime-log.txt; then break; fi
            sleep 2
          done
          grep -q 'MiaadStartup: page-finished' audit/runtime-log.txt
          grep -q 'MiaadStartup: first-frame-ready' audit/runtime-log.txt
          grep -q 'MiaadStartup: content-ready' audit/runtime-log.txt
          check_app_crashes audit/runtime-log.txt
          initial_pid="$(adb shell pidof com.miaad.app | tr -d '\r')"
          test -n "$initial_pid"
          installed="$(adb shell pm path com.miaad.app | tr -d '\r' | sed -n 's/^package://p' | head -1)"
          test -n "$installed"
          for attempt in 1 2 3; do
            if timeout 90s adb pull "$installed" audit/installed-base.apk && test "$(sha256sum audit/installed-base.apk | cut -d' ' -f1)" = "$expected"; then break; fi
            rm -f audit/installed-base.apk
            sleep 5
          done
          test -s audit/installed-base.apk
          test "$(sha256sum audit/installed-base.apk | cut -d' ' -f1)" = "$expected"
          before_page="$(grep -c 'MiaadStartup: page-finished' audit/runtime-log.txt)"
          before_frame="$(grep -c 'MiaadStartup: first-frame-ready' audit/runtime-log.txt)"
          before_content="$(grep -c 'MiaadStartup: content-ready' audit/runtime-log.txt)"
          adb shell am force-stop com.miaad.app
          adb shell am start -W -n com.miaad.app/.MainActivity --ez miaad_isolated_no_firebase true
          for attempt in $(seq 1 60); do
            adb logcat -d -s MiaadStartup:I MiaadWeb:E AndroidRuntime:E > audit/restart-log.txt
            if test "$(grep -c 'MiaadStartup: content-ready' audit/restart-log.txt || :)" -gt "$before_content"; then break; fi
            sleep 2
          done
          test "$(grep -c 'MiaadStartup: page-finished' audit/restart-log.txt || :)" -gt "$before_page"
          test "$(grep -c 'MiaadStartup: first-frame-ready' audit/restart-log.txt || :)" -gt "$before_frame"
          test "$(grep -c 'MiaadStartup: content-ready' audit/restart-log.txt || :)" -gt "$before_content"
          check_app_crashes audit/restart-log.txt
          restarted_pid="$(adb shell pidof com.miaad.app | tr -d '\r')"
          test -n "$restarted_pid" && test "$restarted_pid" != "$initial_pid"
          printf 'API=%s\nAPK_SHA256=%s\nINSTALLED_SHA256=%s\nSTARTUP=PASS\nRESTART=PASS\n' "${{ matrix.api }}" "$expected" "$expected" > audit/installed-runtime.txt
          SH
      - name: Install and restart same-run APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash "$RUNNER_TEMP/check-installed-apk.sh"
      - name: Upload installed runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-installed-api${{ matrix.api }}
          path: audit/
          if-no-files-found: warn
          retention-days: 90

  native-persistence-instrumentation:
    needs: targeted-verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-built-apk
          path: runtime
      - uses: actions/download-artifact@v4
        with:
          name: miaad-phase-1c-v1r7r1-native-test-apk
          path: runtime-tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare APK signature verifier
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0"
      - name: Verify same-build application and test APKs
        run: |
          set -euo pipefail
          app=runtime/app/build/outputs/apk/debug/app-debug.apk
          tests=runtime-tests/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$app" && test -s "$tests"
          test "$(sha256sum "$app" | cut -d' ' -f1)" = "$(cut -d' ' -f1 runtime/audit/cloud-repair-apk-sha256.txt)"
          test "$(sha256sum "$tests" | cut -d' ' -f1)" = "$(cut -d' ' -f1 runtime-tests/audit/instrumentation-apk.sha256)"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          app_cert="$("$apksigner" verify --print-certs "$app" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test_cert="$("$apksigner" verify --print-certs "$tests" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$app_cert" && test "$app_cert" = "$test_cert"
          test "MATCHED_SIGNER_SHA256=$app_cert" = "$(cat runtime-tests/audit/native-apk-signing.txt)"
          mkdir -p audit
          sha256sum "$app" "$tests" > audit/native-apk-pair.sha256
          printf 'MATCHED_SIGNER_SHA256=%s\n' "$app_cert" > audit/native-apk-signing.txt
      - name: Start isolated Firebase Firestore Emulator
        run: |
          npm install -g firebase-tools@13.35.1
          printf '%s\n' '{"emulators":{"firestore":{"host":"0.0.0.0","port":8080},"auth":{"host":"0.0.0.0","port":9099},"ui":{"enabled":false}}}' > "$RUNNER_TEMP/firebase-v1r7.json"
          firebase emulators:start --only firestore,auth --project demo-miaad-v1r7 --config "$RUNNER_TEMP/firebase-v1r7.json" > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/firebase-pid"
          for attempt in $(seq 1 180); do
            if curl --max-time 2 -s -o /dev/null http://127.0.0.1:8080/; then break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/firebase-pid")" 2>/dev/null; then cat "$RUNNER_TEMP/firestore-emulator.log"; exit 1; fi
            sleep 2
          done
          curl --max-time 5 -s -o /dev/null http://127.0.0.1:8080/
          for attempt in $(seq 1 50); do
            if curl --max-time 2 -s -o /dev/null http://127.0.0.1:9099/; then break; fi
            sleep 2
          done
          curl --max-time 5 -s -o /dev/null http://127.0.0.1:9099/
      - name: Prepare isolated instrument script
        run: |
          cat > "$RUNNER_TEMP/run-native-v1r7.sh" <<'SH'
          set -euo pipefail
          adb wait-for-device
          adb install -r runtime/app/build/outputs/apk/debug/app-debug.apk
          adb install -r runtime-tests/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb logcat -G 4M || :
          adb logcat -c || :
          # Execute true FirebaseAuth A-B-A first; if it fails, do not run the full suite.
          set -o pipefail
          set +e
          timeout --signal=TERM --kill-after=20s 900s adb shell am instrument -w -r -e class com.miaad.app.NativeWriteBoundaryTest#realFirebaseAuthEmulatorAtoBPreventsCrossUidRemoteWrites com.miaad.app.test/androidx.test.runner.AndroidJUnitRunner | tee audit/native-auth-targeted.txt
          targeted_result="${PIPESTATUS[0]}"
          set -e
          adb logcat -d -v threadtime -s MiaadAuthProbe:I AndroidRuntime:E FirebaseAuth:W FirebaseFirestore:W MiaadWeb:E MiaadStartup:I > audit/native-auth-targeted-logcat.txt || :
          if test "$targeted_result" -ne 0; then echo "Real FirebaseAuth targeted test failed: ${targeted_result}" >&2; exit "$targeted_result"; fi
          grep -Eq 'OK \(1 test\)' audit/native-auth-targeted.txt
          if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|java.lang.AssertionError' audit/native-auth-targeted.txt; then exit 1; fi
          set +e
          timeout --signal=TERM --kill-after=20s 1200s adb shell am instrument -w -r com.miaad.app.test/androidx.test.runner.AndroidJUnitRunner | tee audit/native-instrumentation.txt
          result="${PIPESTATUS[0]}"
          set -e
          adb logcat -d -v threadtime -s MiaadAuthProbe:I AndroidRuntime:E FirebaseAuth:W FirebaseFirestore:W MiaadWeb:E MiaadStartup:I > audit/native-logcat.txt || :
          if test "$result" -ne 0; then echo "Native instrumentation exit=${result}" >&2; exit "$result"; fi
          grep -Eq 'OK \(18 tests\)' audit/native-instrumentation.txt
          if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|java.lang.AssertionError' audit/native-instrumentation.txt; then exit 1; fi
          SH
      - name: Execute Android Java + Firestore emulator qualification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Same APK pair qualified above. API 26 already booted successfully
          # in the installed-runtime matrix of the exact previous CI run.
          # Deliberately limit AVD resources after API 36 boot timeout.
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: bash "$RUNNER_TEMP/run-native-v1r7.sh"
      - name: Retain native and emulator logs
        if: always()
        run: |
          mkdir -p audit
          cp "$RUNNER_TEMP/firestore-emulator.log" audit/ 2>/dev/null || :
          (test -f "$RUNNER_TEMP/firebase-pid" && kill "$(cat "$RUNNER_TEMP/firebase-pid")") 2>/dev/null || :
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miaad-phase-1c-v1r7r1-native-emulator-evidence
          path: audit/
          if-no-files-found: warn
          retention-days: 90

  firestore-rules-qualification:
    # This is intentionally distinct from permissive native test fixtures.
    # It loads the actual repository rules and uses only local demo emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Start isolated rules-enabled Firebase emulators
        run: |
          set -euo pipefail
          mkdir -p audit
          npm install -g firebase-tools@13.35.1
          printf '%s\n' '{"firestore":{"rules":"firebase/firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8081},"auth":{"host":"127.0.0.1","port":9098},"ui":{"enabled":false}}}' > firebase-rules-ci.json
          firebase emulators:start --only firestore,auth --project demo-miaad-v1r7 --config firebase-rules-ci.json > audit/firebase-rules-emulator.log 2>&1 &
          echo "$!" > audit/rules-emulator.pid
          for attempt in $(seq 1 180); do
            if curl --max-time 2 -s -o /dev/null http://127.0.0.1:8081/ &&
               curl --max-time 2 -s -o /dev/null http://127.0.0.1:9098/; then break; fi
            if ! kill -0 "$(cat audit/rules-emulator.pid)" 2>/dev/null; then cat audit/firebase-rules-emulator.log; exit 1; fi
            sleep 2
          done
          curl --max-time 5 -s -o /dev/null http://127.0.0.1:8081/
          curl --max-time 5 -s -o /dev/null http://127.0.0.1:9098/
          if grep -q "Did not find a Cloud Firestore rules file" audit/firebase-rules-emulator.log; then
            echo "FAIL: actual Firestore rules were not loaded"; exit 1
          fi
          sha256sum firebase/firestore.rules > audit/firestore-rules.sha256
      - name: Qualify owner and cross-owner rules using genuine emulator-issued users
        run: |
          set -euo pipefail
          python3 scripts/test-firestore-rules.py | tee audit/firestore-rules-results.txt
      - name: Archive rules evidence
        if: always()
        run: |
          if test -f audit/rules-emulator.pid; then kill "$(cat audit/rules-emulator.pid)" || :; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miaad-phase-1c-v1r7r1-firestore-rules-evidence
          path: audit/
          if-no-files-found: warn
          retention-days: 90

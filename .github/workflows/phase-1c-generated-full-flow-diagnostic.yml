          const declarations=code=>{const ast=acorn.parse(code,{ecmaVersion:'latest',sourceType:'script'}),out=[];for(const n of ast.body){if(n.type==='VariableDeclaration')for(const d of n.declarations)for(const name of names(d.id))out.push({name,kind:n.kind});else if(n.type==='FunctionDeclaration'&&n.id)out.push({name:n.id.name,kind:'function'});else if(n.type==='ClassDeclaration'&&n.id)out.push({name:n.id.name,kind:'class'})}return out};
          const files=[],globalMap=new Map,snippets=[];

name: Phase 1C Generated Full-Flow Sequence Differential Diagnostic V1R4
on:
  push:
    branches:
      - miaad/phase-1c-occurrence-authority-generated-diagnostic-v1r4
permissions:
  contents: read
env:
  CANDIDATE_SHA: 6a3b367e4f0a9d007846452b9343733ff3adf086
  CANDIDATE_TREE: 92558e4b3859baf71c3eaec4de26d1436e921eec
  OFFICIAL_SHA: ca703d82a9a500393a0ce8948b279488f8e6c517
  MAIN_SHA: 16477b29106d59d0e1fe7d4e99c63b55d6d97327
  WORKFLOW_PATH: .github/workflows/phase-1c-generated-full-flow-diagnostic.yml
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full-flow diagnostic
        shell: bash
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          test "$(git ls-remote origin refs/heads/miaad/phase-1c-occurrence-authority-candidate | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/miaad/phase-1-correctness | awk '{print $1}')" = "$OFFICIAL_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git merge-base "$OFFICIAL_SHA" "$CANDIDATE_SHA")" = "$OFFICIAL_SHA"
          test "$(git rev-list --count "$OFFICIAL_SHA..$CANDIDATE_SHA")" -eq 13
          test "$(git rev-list --count "$CANDIDATE_SHA..$OFFICIAL_SHA")" -eq 0
          git diff --name-only "$CANDIDATE_SHA" HEAD > audit/diagnostic-paths.txt
          test "$(wc -l < audit/diagnostic-paths.txt)" -eq 1
          grep -Fxq "$WORKFLOW_PATH" audit/diagnostic-paths.txt
          read additions deletions < <(git diff --numstat "$OFFICIAL_SHA" "$CANDIDATE_SHA" | awk 'BEGIN{a=0;d=0}{a+=$1;d+=$2}END{print a,d}')
          test "$additions" -eq 581
          test "$deletions" -eq 44
          git diff --check "$CANDIDATE_SHA" HEAD
          printf 'head=%s\nparent=%s\ntree=%s\nahead=13\nbehind=0\npaths=13\n+%s/-%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" "$(git rev-parse "$CANDIDATE_SHA^{tree}")" "$additions" "$deletions" | tee audit/identity.txt

          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.55.0 esbuild@0.28.2 acorn@8.18.0 @esbuild/linux-x64@0.28.2
          node scripts/verify-compat-toolchain.cjs | tee audit/compat-toolchain-lock.txt
          {
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "console.log('DIAGNOSTIC PLAYWRIGHT RESOLUTION PASS'); console.log(require.resolve('playwright'))"
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "console.log('DIAGNOSTIC ACORN RESOLUTION PASS'); console.log(require.resolve('acorn'))"
          } | tee audit/module-resolution.txt
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/v1r4-helper-scripts.tgz"
          mkdir -p "$RUNNER_TEMP/v1r4-helper-scripts"
          tar -xzf "$RUNNER_TEMP/v1r4-helper-scripts.tgz" -C "$RUNNER_TEMP/v1r4-helper-scripts"
          H="$RUNNER_TEMP/v1r4-helper-scripts"
          for f in "$H"/*.cjs; do node --check "$f"; done
          echo "TRANSFORM AUDIT NODE SYNTAX PASS" | tee audit/transform-node-syntax.txt
          node "$H/format-gate.cjs" | tee audit/hash-reference-format.txt
          node scripts/build-compat.cjs | tee audit/compat-generation.txt
          node "$H/hash-evidence.cjs" | tee audit/hash-evidence.txt

          set +e
          MIAAD_ASSET_ROOT=app/src/main/assets PLAYWRIGHT_CHANNEL=chrome node scripts/test-flows.cjs > audit/original-source-flow.log 2>&1
          source_exit=$?
          MIAAD_ASSET_ROOT=app/build/generated/compatAssets PLAYWRIGHT_CHANNEL=chrome node scripts/test-flows.cjs > audit/original-generated-flow.log 2>&1
          generated_original_exit=$?
          MIAAD_ASSET_ROOT=app/build/generated/compatAssets PLAYWRIGHT_CHANNEL=chrome node scripts/test-flows.cjs > audit/generated-attempt-1.log 2>&1
          attempt1_exit=$?
          MIAAD_ASSET_ROOT=app/build/generated/compatAssets PLAYWRIGHT_CHANNEL=chrome node scripts/test-flows.cjs > audit/generated-attempt-2.log 2>&1
          attempt2_exit=$?
          MIAAD_ASSET_ROOT=app/build/generated/compatAssets PLAYWRIGHT_CHANNEL=chrome node scripts/test-flows.cjs > audit/generated-attempt-3.log 2>&1
          attempt3_exit=$?
          set -e
          printf 'source=%s\ngenerated-original=%s\nattempt-1=%s\nattempt-2=%s\nattempt-3=%s\n' "$source_exit" "$generated_original_exit" "$attempt1_exit" "$attempt2_exit" "$attempt3_exit" | tee audit/original-flow-exits.txt
          cat audit/original-source-flow.log
          cat audit/original-generated-flow.log
          cat audit/generated-attempt-1.log
          cat audit/generated-attempt-2.log
          cat audit/generated-attempt-3.log
          node "$H/analyze-attempts.cjs"

          set +e
          FLOW_SOURCE="$GITHUB_WORKSPACE/scripts/test-flows.cjs" FLOW_TARGET="$RUNNER_TEMP/test-flows-full-sequence-instrumented.cjs" ANCHOR_EVIDENCE="$GITHUB_WORKSPACE/audit/instrumentation-anchor-evidence.txt" NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$H/build-instrumented.cjs" > audit/instrumentation-build.log 2>&1
          builder_exit=$?
          set -e
          cat audit/instrumentation-build.log
          instrumented_source_exit=125
          instrumented_generated_exit=125
          if [ "$builder_exit" -eq 0 ]; then
            node --check "$RUNNER_TEMP/test-flows-full-sequence-instrumented.cjs"
            echo "FULL-FLOW INSTRUMENTATION NODE SYNTAX PASS" | tee audit/instrumentation-node-syntax.txt
            ln -sf "$GITHUB_WORKSPACE/scripts/test-biweekly-phase-domain-control.cjs" "$RUNNER_TEMP/test-biweekly-phase-domain-control.cjs"
            set +e
            DIAG_OUT="$GITHUB_WORKSPACE/audit/full-sequence-source.json" PLAYWRIGHT_PATH="$GITHUB_WORKSPACE/node_modules/playwright" MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/src/main/assets" PLAYWRIGHT_CHANNEL=chrome NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/test-flows-full-sequence-instrumented.cjs" > audit/instrumented-source-flow.log 2>&1
            instrumented_source_exit=$?
            DIAG_OUT="$GITHUB_WORKSPACE/audit/full-sequence-generated.json" PLAYWRIGHT_PATH="$GITHUB_WORKSPACE/node_modules/playwright" MIAAD_ASSET_ROOT="$GITHUB_WORKSPACE/app/build/generated/compatAssets" PLAYWRIGHT_CHANNEL=chrome NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/test-flows-full-sequence-instrumented.cjs" > audit/instrumented-generated-flow.log 2>&1
            instrumented_generated_exit=$?
            set -e
            cat audit/instrumented-source-flow.log
            cat audit/instrumented-generated-flow.log
          else
            printf '{"assetRoot":"source","checkpoints":[],"failure":{"name":"InstrumentationBuilderFailure","message":"builder exit %s"}}\n' "$builder_exit" > audit/full-sequence-source.json
            printf '{"assetRoot":"generated","checkpoints":[],"failure":{"name":"InstrumentationBuilderFailure","message":"builder exit %s"}}\n' "$builder_exit" > audit/full-sequence-generated.json
          fi
          if [ ! -s audit/full-sequence-source.json ]; then
            printf '{"assetRoot":"source","checkpoints":[],"failure":{"name":"NoTelemetry","message":"instrumented source exit %s"}}\n' "$instrumented_source_exit" > audit/full-sequence-source.json
          fi
          if [ ! -s audit/full-sequence-generated.json ]; then
            printf '{"assetRoot":"generated","checkpoints":[],"failure":{"name":"NoTelemetry","message":"instrumented generated exit %s"}}\n' "$instrumented_generated_exit" > audit/full-sequence-generated.json
          fi
          node "$H/compare-full-sequence.cjs" | tee audit/full-sequence-differential-stdout.txt
          node "$H/transform-audit.cjs" | tee audit/transform-audit-stdout.txt
          printf 'builder_exit=%s\ninstrumented_source_exit=%s\ninstrumented_generated_exit=%s\n' "$builder_exit" "$instrumented_source_exit" "$instrumented_generated_exit" | tee audit/diagnostic-exit-status-summary.txt
          node "$H/final-decision.cjs" | tee audit/final-diagnostic-decision-stdout.txt
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-generated-full-flow-diagnostic-v1r4
          path: audit/
          if-no-files-found: warn
          retention-days: 30

name: Phase 1C Generated Persistence Differential Diagnostic V1R2
on:
  push:
    branches: ['miaad/phase-1c-occurrence-authority-generated-diagnostic-v1r2']
permissions:
  contents: read
env:
  CANDIDATE_SHA: 6a3b367e4f0a9d007846452b9343733ff3adf086
  CANDIDATE_TREE: 92558e4b3859baf71c3eaec4de26d1436e921eec
  OFFICIAL_SHA: ca703d82a9a500393a0ce8948b279488f8e6c517
  MAIN_SHA: 16477b29106d59d0e1fe7d4e99c63b55d6d97327
  WORKFLOW_PATH: .github/workflows/phase-1c-generated-persistence-diagnostic.yml
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reproduce and diagnose source/generated persistence
        env: {PLAYWRIGHT_CHANNEL: chrome}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"
          test "$(git ls-remote origin refs/heads/miaad/phase-1c-occurrence-authority-candidate | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/miaad/phase-1-correctness | awk '{print $1}')" = "$OFFICIAL_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_SHA"
          test "$(git merge-base "$OFFICIAL_SHA" "$CANDIDATE_SHA")" = "$OFFICIAL_SHA"
          test "$(git rev-list --count "$OFFICIAL_SHA..$CANDIDATE_SHA")" -eq 13
          test "$(git rev-list --count "$CANDIDATE_SHA..$OFFICIAL_SHA")" -eq 0
          git diff --name-only "$CANDIDATE_SHA" HEAD > audit/diagnostic-paths.txt
          test "$(wc -l < audit/diagnostic-paths.txt)" -eq 1
          grep -Fxq "$WORKFLOW_PATH" audit/diagnostic-paths.txt
          read additions deletions < <(git diff --numstat "$OFFICIAL_SHA" "$CANDIDATE_SHA" | awk 'BEGIN{a=0;d=0}{a+=$1;d+=$2}END{print a,d}')
          test "$additions" -eq 581; test "$deletions" -eq 44
          git diff --check "$CANDIDATE_SHA" HEAD
          printf 'head=%s\nparent=%s\ntree=%s\nahead=13\nbehind=0\npaths=13\n+%s/-%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" "$(git rev-parse "$CANDIDATE_SHA^{tree}")" "$additions" "$deletions" | tee audit/identity.txt

          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.55.0 esbuild@0.28.2 acorn@8.18.0 @esbuild/linux-x64@0.28.2
          node scripts/verify-compat-toolchain.cjs | tee audit/compat-toolchain-lock.txt
          node - <<'NODE' | tee audit/hash-reference-format.txt
          const refs=[
            '7a03ee9768355b1a26f0a439e85406314cbb8fec9b88d9b4b74db445161fe8dd',
            'e0e472d232f927890518f40b2b6131425b2e2a429bfc0fc7762ca0a604df13f0',
            '332aaa0de0d9a73fb977053652f0ca58b3ea7563678f85549bdf4d7bffa9469b',
            'b6393820dbbf15e2e3e081582e0c61114ab2c7e15789a2c09cce0d1dbe55ecb6',
            'f59918acc9d1f0fc560395d4b402e6364002ad2fb3d49a28d8d8d5a121bfecca',
            '28a8ca70004129aa97bbb346f712c248935da6012e7d216edb814e98e679ee59'
          ];
          for (const ref of refs) {
            if (!/^[0-9a-f]{64}$/.test(ref)) throw new Error('Malformed historical SHA256 reference: '+ref);
          }
          console.log('HISTORICAL HASH REFERENCES FORMAT PASS');
          NODE
          node scripts/build-compat.cjs | tee audit/compat-generation.txt
          node - <<'NODE' | tee audit/hash-evidence.txt
          const fs=require('fs'),c=require('crypto'),a=require('assert/strict'),p=require('path');const h=x=>c.createHash('sha256').update(fs.readFileSync(x)).digest('hex'),r=JSON.parse(fs.readFileSync('audit/compat-generation.json'));a.equal(r.files.length,14);a.equal(r.sourceBytes,186763);a.equal(r.generatedBytes,217807);const e={'app-core.js':['7a03ee9768355b1a26f0a439e85406314cbb8fec9b88d9b4b74db445161fe8dd','e0e472d232f927890518f40b2b6131425b2e2a429bfc0fc7762ca0a604df13f0'],'app-domain.js':['332aaa0de0d9a73fb977053652f0ca58b3ea7563678f85549bdf4d7bffa9469b','b6393820dbbf15e2e3e081582e0c61114ab2c7e15789a2c09cce0d1dbe55ecb6'],'app-integration.js':['f59918acc9d1f0fc560395d4b402e6364002ad2fb3d49a28d8d8d5a121bfecca','28a8ca70004129aa97bbb346f712c248935da6012e7d216edb814e98e679ee59']};for(const[f,[s,g]]of Object.entries(e)){const x=h(p.join('app/src/main/assets',f)),y=h(p.join('app/build/generated/compatAssets',f));console.log(f,x,y);a.equal(x,s);a.equal(y,g)}console.log('HISTORICAL V1R5R2 GENERATED OUTPUT REPRODUCED PASS');
          NODE

          python3 - <<'PY'
          import base64,gzip,os
          open(os.path.join(os.environ['RUNNER_TEMP'],'phase1c-generated-persistence-diagnostic.cjs'),'wb').write(gzip.decompress(base64.b64decode('')))
          open(os.path.join(os.environ['RUNNER_TEMP'],'phase1c-generated-transform-audit.cjs'),'wb').write(gzip.decompress(base64.b64decode('')))
          PY
          node --check "$RUNNER_TEMP/phase1c-generated-persistence-diagnostic.cjs"
          node --check "$RUNNER_TEMP/phase1c-generated-transform-audit.cjs"

          test -d "$GITHUB_WORKSPACE/node_modules/playwright"
          test -d "$GITHUB_WORKSPACE/node_modules/acorn"
          {
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "const p=require.resolve('playwright'); console.log('DIAGNOSTIC PLAYWRIGHT RESOLUTION PASS'); console.log(p)"
            NODE_PATH="$GITHUB_WORKSPACE/node_modules" node -e "const p=require.resolve('acorn'); console.log('DIAGNOSTIC ACORN RESOLUTION PASS'); console.log(p)"
          } | tee audit/module-resolution.txt

          rm -f "$RUNNER_TEMP/scripts"
          ln -s "$GITHUB_WORKSPACE/scripts" "$RUNNER_TEMP/scripts"

          : > audit/runtime-diagnostic.log
          : > audit/generated-global-audit-summary.txt
          set +e
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/phase1c-generated-persistence-diagnostic.cjs" 2>&1 | tee audit/runtime-diagnostic.log
          diag_exit=${PIPESTATUS[0]}
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/phase1c-generated-transform-audit.cjs" 2>&1 | tee audit/generated-global-audit-summary.txt
          transform_exit=${PIPESTATUS[0]}
          set -e
          printf 'runtime_diagnostic_exit=%s\ntransform_audit_exit=%s\n' "$diag_exit" "$transform_exit" | tee audit/diagnostic-exit-status.txt
          if [ "$transform_exit" -ne 0 ]; then exit "$transform_exit"; fi
          if [ "$diag_exit" -ne 0 ]; then exit "$diag_exit"; fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-generated-diagnostic-v1r2
          path: audit/
          if-no-files-found: warn
          retention-days: 30

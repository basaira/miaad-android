          "$RUNNER_TEMP/run-generated-suite-v1r6r2.sh"
          MIAAD_ASSET_ROOT="$MIAAD_ASSET_ROOT" node "$RUNNER_TEMP/phase1c-primary-authority-semantic.cjs" | tee audit/clean-generated-primary-authority-matrix.txt
          for marker in A B C D E F; do grep -Fxq "PRIMARY AUTHORITY CASE $marker PASS" audit/clean-generated-primary-authority-matrix.txt; done
          grep -Fxq 'PRIMARY AUTHORITY MATRIX PASS: 6/6' audit/clean-generated-primary-authority-matrix.txt
          echo 'CLEAN-GENERATED PRIMARY AUTHORITY MATRIX PASS: 6/6' | tee audit/clean-generated-primary-authority-pass.txt
          node scripts/compat-assets-manifest.cjs audit/generated-assets-cleanbuild.json > audit/generated-assets-cleanbuild.sha256
          cmp audit/generated-assets-tested.sha256 audit/generated-assets-cleanbuild.sha256
          echo 'CLEAN REGENERATION EQUIVALENCE PASS' | tee audit/regeneration-equivalence.txt

      - name: Run Android Gradle gates
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$(command -v gradle)" ./gradlew
          ./gradlew lintDebug --stacktrace | tee audit/android-lint.txt
          ./gradlew testDebugUnitTest --stacktrace | tee audit/android-unit-task.txt
          echo 'Gradle task invocation = PASS' | tee audit/android-unit-evidence.txt
          if grep -Eq ':app:testDebugUnitTest([^[:alnum:]_]|$).*NO-SOURCE|> Task :app:testDebugUnitTest NO-SOURCE' audit/android-unit-task.txt; then echo 'Native Android unit-test payload = NO-SOURCE' | tee -a audit/android-unit-evidence.txt; else echo 'Native Android unit-test payload = EXECUTED' | tee -a audit/android-unit-evidence.txt; fi
          ./gradlew assembleDebug --stacktrace | tee audit/android-assemble-debug.txt
          rm -f ./gradlew
          node scripts/compat-assets-manifest.cjs audit/generated-assets-final.json > audit/generated-assets-final.sha256
          cmp audit/generated-assets-tested.sha256 audit/generated-assets-final.sha256

      - name: Audit exact same-run APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 scripts/audit_brand.py --apk "$APK" --output audit --apk-assets app/build/generated/compatAssets | tee audit/apk-audit-console.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > audit/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > audit/apk-signature.txt
          node scripts/verify-apk-compat.cjs "$APK" | tee audit/apk-compat.txt
          sha256sum "$APK" | awk '{print $1}' | tee audit/apk-sha256.txt
          stat -c '%s' "$APK" | tee audit/apk-size-bytes.txt
          grep '^package:' audit/aapt-badging.txt | head -n1 | tee audit/apk-package-version.txt
          grep '^application-label:' audit/aapt-badging.txt | head -n1 | tee audit/apk-application-label.txt
          {
            echo "raw_apk_sha256=$(cat audit/apk-sha256.txt)"
            echo "raw_apk_size=$(cat audit/apk-size-bytes.txt)"
            cat audit/apk-package-version.txt
            cat audit/apk-application-label.txt
          } | tee audit/authoritative-apk-identity.txt

      - name: Upload exact same-run APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record APK archive digest separately
        env:
          ARTIFACT_ARCHIVE_DIGEST: ${{ steps.upload_apk.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          { echo "raw_apk_sha256=$(cat audit/apk-sha256.txt)"; echo "artifact_archive_digest=$ARTIFACT_ARCHIVE_DIGEST"; echo 'NOTE: artifact archive digest is not raw APK SHA256.'; } | tee audit/apk-artifact-digest-distinction.txt

      - name: Upload static source generated verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r2-static-audit
          path: audit/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload source verification evidence
        if: always()

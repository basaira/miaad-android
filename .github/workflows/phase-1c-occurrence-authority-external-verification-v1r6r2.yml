      - name: Upload tested-generated verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r2-tested-generated
          path: |
            audit/generated-*
            audit/compat-generation.*
            audit/historical-generated-hashes.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated repeatability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r2-generated-repeatability
          path: |
            audit/generated-test-flows-repeatability.txt
            audit/generated-flows-attempt-2.txt
            audit/generated-flows-attempt-3.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Primary Authority matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r2-primary-authority
          path: |
            audit/source-primary-*
            audit/generated-primary-*
            audit/clean-generated-primary-*
            audit/primary-authority-helper-separation.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload transform audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r2-transform-audit
          path: |
            audit/generated-classic-script-audit.txt
            audit/generated-global-declarations.json
            audit/transform-audit-helper-syntax.txt
          if-no-files-found: error

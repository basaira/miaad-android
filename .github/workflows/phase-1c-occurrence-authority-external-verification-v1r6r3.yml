      - name: Upload transform audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r3-transform-audit
          path: |
            audit/generated-classic-script-audit.txt
            audit/generated-global-declarations.json
            audit/transform-audit-helper-syntax.txt
          if-no-files-found: error

            audit/generated-flows-attempt-2.txt
            audit/generated-flows-attempt-3.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Primary Authority matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miaad-phase-1c-occurrence-authority-v1r6r3-primary-authority
          path: |
            audit/source-primary-*
            audit/generated-primary-*
            audit/clean-generated-primary-*
            audit/primary-authority-helper-separation.txt
          if-no-files-found: error

        \ pass\nclass SnapshotContradiction(RuntimeError): pass\n\ndef read_snapshot(label, poll=False):\n    import\
        \ time, json, hashlib, xml.etree.ElementTree as ET\n    deadline=time.monotonic()+60.0\n    start=time.monotonic()\n\
        \    samples=[]\n    stable_signature=None\n    any_xml=False\n    any_json=False\n    def telemetry(outcome,\
        \ reason=None):\n        try:\n            proc=adb('shell','pidof',PACKAGE,timeout=3)\n            pid=proc.stdout.decode('utf-8','replace').strip()\n\
        \        except Exception as err:\n            pid='unavailable: '+repr(err)\n        signal_file=AUDIT/'post-restart-startup-signals.txt'\n\
        \        signals=signal_file.read_text(errors='replace') if signal_file.exists() else ''\n        t={'label':label,'outcome':outcome,'reason':reason,'readAttempts':len(samples),'attempts':samples,\n\
        \           'elapsedSeconds':round(time.monotonic()-start,3),'completeXmlObserved':any_xml,\n           'validJsonObserved':any_json,'appPid':pid,\n\
        \           'startupSignals':{k:(k in signals) for k in ('page-finished','first-frame-ready','content-ready')},\n\
        \           'firstFailure':next((x for x in samples if x.get('reason')),None),\n           'lastFailure':next((x\
        \ for x in reversed(samples) if x.get('reason')),None)}\n        AUDIT.joinpath('snapshot-read-telemetry-'+label+'.json').write_text(json.dumps(t,indent=2,ensure_ascii=False),encoding='utf-8')\n\
        \    while True:\n        remaining=deadline-time.monotonic()\n        if remaining<=0:\n            telemetry('INCOMPLETE','API36\
        \ POST-RESTART SNAPSHOT EVIDENCE INCOMPLETE')\n            raise SnapshotEvidenceError('API36 POST-RESTART SNAPSHOT\
        \ EVIDENCE INCOMPLETE')\n        tick=time.monotonic()\n        item={'attempt':len(samples)+1,'elapsedSeconds':round(tick-start,3),'bytes':0,'sha256':None,'adbReturnCode':None,'xmlParsed':False,'jsonParsed':False,'reason':None}\n\
        \        samples.append(item)\n        try:\n            p=adb('exec-out','cat',PREFS,timeout=max(.5,min(5.0,remaining)))\n\
        \            raw=p.stdout or b''\n            item['adbReturnCode']=p.returncode\n            item['bytes']=len(raw)\n\
        \            item['sha256']=hashlib.sha256(raw).hexdigest()\n            if p.returncode!=0:\n              \
        \  raise ValueError('ADB_NONZERO: '+str(p.returncode)+' '+(p.stderr or b'').decode('utf-8','replace')[:180])\n\
        \            if not raw: raise ValueError('ADB_EMPTY_OUTPUT')\n            root=ET.fromstring(raw)\n        \
        \    item['xmlParsed']=True\n            any_xml=True\n            node=next((n for n in root.findall('string')\
        \ if n.attrib.get('name')=='snapshot'),None)\n            if node is None or not node.text: raise ValueError('MISSING_SNAPSHOT_KEY')\n\
        \            raw_json=node.text\n            data=json.loads(raw_json)\n            item['jsonParsed']=True\n\
        \            any_json=True\n            if not isinstance(data,dict) or data.get('schemaVersion')!=4 or not isinstance(data.get('domain'),dict)\
        \ or data['domain'].get('version')!=4 or not isinstance(data['domain'].get('records'),dict) or not isinstance(data['domain'].get('schedules'),dict):\n\
        \                raise ValueError('STRUCTURE_INVALID')\n            proof=audit_snapshot(raw_json,data,label)\n\
        \            item['semanticStatus']=proof.get('status')\n            if proof.get('status')=='WRONG':\n     \
        \           item['reason']='VALIDATED_SEMANTIC_CONTRADICTION'\n                telemetry('SEMANTIC_CONTRADICTION',item['reason'])\n\
        \                raise SnapshotContradiction('VALIDATED_SEMANTIC_CONTRADICTION '+str([k for k,v in (proof.get('checks')\
        \ or {}).items() if v is False]))\n            if proof.get('status')!='PASS':\n                item['reason']='SEMANTIC_SETUP_INCOMPLETE'\n\
        \                stable_signature=None\n            else:\n                sig=json.dumps(semantic_fingerprint(data),sort_keys=True,ensure_ascii=False)\n\
        \                item['semanticSha256']=hashlib.sha256(sig.encode()).hexdigest()\n                if stable_signature==sig:\n\
        \                    AUDIT.joinpath('miaad_native_v1-'+label+'.xml').write_bytes(raw)\n                    AUDIT.joinpath('native-snapshot-'+label+'.raw.json').write_text(raw_json,encoding='utf-8')\n\
        \                    AUDIT.joinpath('native-snapshot-'+label+'.json').write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding='utf-8')\n\
        \                    telemetry('PASS')\n                    return raw_json,data\n                stable_signature=sig\n\
        \                item['reason']='AWAITING_INDEPENDENT_STABLE_READ'\n        except SnapshotContradiction:\n \

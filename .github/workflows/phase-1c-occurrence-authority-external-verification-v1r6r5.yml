name: Phase 1C V1R6R5 Authenticated Authoritative External Verification
'on':
  push:
    branches:
    - miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r5
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_SHA: 6a3b367e4f0a9d007846452b9343733ff3adf086
  CANDIDATE_TREE: 92558e4b3859baf71c3eaec4de26d1436e921eec
  OFFICIAL_SHA: ca703d82a9a500393a0ce8948b279488f8e6c517
  MAIN_SHA: 16477b29106d59d0e1fe7d4e99c63b55d6d97327
  WORKFLOW_PATH: .github/workflows/phase-1c-occurrence-authority-external-verification-v1r6r5.yml
  HIST_SHA: 43875808a3ffd193f904dd2bee647a3f1e7f8499
  HIST_PATH: .github/workflows/phase-1c-occurrence-authority-external-verification-v1r6r3.yml
  V1R6R1_SHA: 41dcbc63b9ef4e593a4c86007f08a814d8a974b9
  V2_RUN_A: '37208022969'
  V2_SHA_A: 0e4022fd6796adfdabcf5adfc3b575203cd46955
  V2_RUN_B: '37209686038'
  V2_SHA_B: a64f48c3597bf350e82d732176d12327ad1e65aa
  V3_RUN: '37234222936'
  V3_SHA: 4ddd852e611a920a360e81265b7c3c1535601e10
  V3_TREE: 7bd3fb801a7b112cc41b1170b4d4392dd508b2d9
  PACKAGE: com.miaad.app
  ACTIVITY: com.miaad.app/.MainActivity
  PREFS_PATH: /data/data/com.miaad.app/shared_prefs/miaad_native_v1.xml
  V1R6R4_SHA: b5a9266d5a1719a4b6b3d5367dae1c76104eb5a6
  V1R6R4_TREE: 7b5600a8d7c468817f845b21162549c8c512ec2b
  V1R6R4_RUN: '38075392981'
jobs:
  verification:
    name: Fresh source generated Gradle APK V1R6R5
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
    - name: Checkout verification branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Real workflow YAML and Bash validation
      shell: bash
      run: "set -euo pipefail\npython3 -m pip install --disable-pip-version-check PyYAML==6.0.2\npython3 - <<'PY'\nimport\
        \ yaml,pathlib,subprocess\np=pathlib.Path('.github/workflows/phase-1c-occurrence-authority-external-verification-v1r6r5.yml')\n\
        doc=yaml.load(p.read_text(),Loader=yaml.BaseLoader)\nassert len(doc['jobs'])==8\nfor job in doc['jobs'].values():\n\
        \ for step in job['steps']:\n  if 'run' in step:subprocess.run(['bash','-n'],input=step['run'],text=True,check=True)\n\
        print('WORKFLOW YAML PARSE PASS')\nprint('WORKFLOW STRUCTURAL LOAD PASS')\nprint('ALL WORKFLOW BASH RUN BLOCKS\
        \ SYNTAX PASS')\nPY\n"
    - &id001
      name: Prepare pinned verified gate executor
      shell: bash
      run: "set -euo pipefail\npython3 -m pip install --disable-pip-version-check PyYAML==6.0.2\nmkdir -p audit\ncat\
        \ > \"$RUNNER_TEMP/run_legacy.py\" <<'PY'\nimport os,sys,yaml,subprocess,pathlib,re\n\ndef approved_env(raw_env,\
        \ prior):\n    env=prior.copy()\n    token=env.get('GH_TOKEN')\n    if not token or not token.strip() or token.strip()\
        \ in ('${{ github.token }}','***','[MASKED]','dummy-placeholder'):\n        raise RuntimeError('AUTHENTICATION\
        \ HARNESS: CURRENT JOB TOKEN ABSENT OR PLACEHOLDER')\n    # In particular archived GH_TOKEN/GITHUB_TOKEN are\
        \ NEVER resolved/propagated.\n    for key,value in raw_env.items():\n        if key in ('GH_TOKEN','GITHUB_TOKEN'):\n\
        \            continue\n        if not isinstance(value,str):\n            raise RuntimeError('AUTHENTICATION\
        \ HARNESS: NONSTRING HISTORICAL ENV '+key)\n        value=value.replace('${{ github.workspace }}',env['GITHUB_WORKSPACE'])\n\
        \        if re.search(r'\\$\\{\\{.*?\\}\\}',value):\n            raise RuntimeError('AUTHENTICATION HARNESS:\
        \ UNRESOLVED ACTIONS EXPRESSION IN '+key)\n        env[key]=value\n    if env.get('GH_TOKEN') != token:\n   \
        \     raise RuntimeError('AUTHENTICATION HARNESS: APPROVED JOB TOKEN WAS OVERWRITTEN')\n    return env\n\ndef\
        \ nested_auth_smoke():\n    env=approved_env({'GH_TOKEN':'${{ github.token }}','GITHUB_TOKEN':'historical-unsafe'},os.environ.copy())\n\
        \    repo=env['GITHUB_REPOSITORY']\n    # Validate the actual child environment using the same subprocess.env\
        \ as copied shell steps.\n    def query(args):\n        p=subprocess.run(['gh','api',*args],env=env,check=False,capture_output=True,text=True,timeout=30)\n\
        \        if p.returncode:\n            raise RuntimeError('NESTED AUTHENTICATION FAILURE: gh api exit '+str(p.returncode))\n\
        \        return p.stdout.strip()\n    if query(['repos/'+repo,'--jq','.full_name']) != 'basaira/miaad-android':\n\
        \        raise RuntimeError('NESTED AUTHENTICATION FAILURE: REPOSITORY IDENTITY')\n    if query(['repos/'+repo+'/actions/runs/'+env['V1R6R4_RUN'],'--jq','.head_sha'])\
        \ != env['V1R6R4_SHA']:\n        raise RuntimeError('NESTED AUTHENTICATION FAILURE: HISTORICAL RUN IDENTITY')\n\
        \    print('NESTED HARNESS GITHUB API AUTHENTICATION PASS',flush=True)\n\nif __name__=='__main__':\n    if sys.argv[1:]==['--auth-smoke']:\n\
        \        nested_auth_smoke();raise SystemExit(0)\n    kind=sys.argv[1];name=sys.argv[2]\n    sha=os.environ['HIST_SHA'];src=os.environ['HIST_PATH']\n\
        \    raw=subprocess.check_output(['git','show',sha+':'+src])\n    doc=yaml.load(raw,Loader=yaml.BaseLoader)\n\
        \    steps=doc['jobs'][kind]['steps']\n    found=[x for x in steps if x.get('name')==name]\n    if len(found)!=1:raise\
        \ SystemExit('PINNED SOURCE STEP MISSING OR DUPLICATE: '+kind+' / '+name)\n    step=found[0]\n    if 'run' not\
        \ in step:raise SystemExit('PINNED STEP HAS NO RUN SCRIPT '+name)\n    env=approved_env(step.get('env',{}),os.environ.copy())\n\
        \    script=step['run']\n    if re.search(r'\\$\\{\\{.*?\\}\\}',script):\n        raise RuntimeError('AUTHENTICATION\
        \ HARNESS: UNRESOLVED ACTIONS EXPRESSION IN PINNED STEP')\n    path=pathlib.Path(env['RUNNER_TEMP'])/('copied-'+kind+'-'+str(len(name))+'-'+str(abs(sum(ord(c)\
        \ for c in name)))+'.sh')\n    path.write_text(script)\n    subprocess.run(['bash','-n',str(path)],check=True)\n\
        \    print('FRESH PINNED HARNESS STEP:',kind,'/',name,flush=True)\n    subprocess.run(['bash','--noprofile','--norc',str(path)],check=True,env=env)\n\
        PY\npython3 -m py_compile \"$RUNNER_TEMP/run_legacy.py\"\n"
    - name: Authentication harness non-secret regression fixtures
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/auth_regression.py\" <<'PY'\nimport os,sys,tempfile,pathlib,subprocess,json\n\
        sys.path.insert(0,os.environ['RUNNER_TEMP'])\nimport run_legacy\nfrom run_legacy import approved_env\nkey='DUMMY_ALLOWED_CURRENT_JOB_TOKEN'\n\
        base={'GH_TOKEN':key,'GITHUB_TOKEN':'dummy-legacy-existing','GITHUB_WORKSPACE':'/dummy/workspace'}\nassert approved_env({},base)['GH_TOKEN']==key\n\
        assert approved_env({'GH_TOKEN':'${{ github.token }}'},base)['GH_TOKEN']==key\nassert approved_env({'GH_TOKEN':''},base)['GH_TOKEN']==key\n\
        assert approved_env({'GH_TOKEN':'historical-token'},base)['GH_TOKEN']==key\nassert approved_env({'GITHUB_TOKEN':'unsafe-legacy-token'},base)['GH_TOKEN']==key\n\
        assert approved_env({'PATH':'${{ github.workspace }}/bin'},base)['PATH']=='/dummy/workspace/bin'\nfor bad in\
        \ ('',' ','${{ github.token }}','***','[MASKED]','dummy-placeholder'):\n    try:approved_env({},dict(base,GH_TOKEN=bad))\n\
        \    except RuntimeError: pass\n    else:raise AssertionError('absent/placeholder token accepted')\ntry:approved_env({'OVERRIDE':'${{\
        \ secrets.EXAMPLE }}'},base)\nexcept RuntimeError:pass\nelse:raise AssertionError('unresolved expression accepted')\n\
        # Test real subprocess inheritance with only a dummy approved token, never print it.\nassert subprocess.run([sys.executable,'-c','import\
        \ os,sys; sys.exit(0 if os.getenv(\"GH_TOKEN\")==sys.argv[1] else 1)',key],env=approved_env({'GH_TOKEN':'unsafe'},base)).returncode==0\n\
        # Bad child API commands are independently classified before source gate.\ntry:\n    p=subprocess.run([sys.executable,'-c','import\
        \ sys;sys.exit(4)'],capture_output=True,env=approved_env({},base),timeout=3)\n    if p.returncode: raise RuntimeError('NESTED\
        \ AUTHENTICATION FAILURE: API EXIT')\nexcept RuntimeError as exc: assert 'NESTED AUTHENTICATION FAILURE' in str(exc)\n\
        else:raise AssertionError('API failure did not classify')\n# Neither print nor write token in artifacts.\nwith\
        \ tempfile.TemporaryDirectory() as tmp:\n    p=pathlib.Path(tmp)/'safe-diagnostic.txt'\n    p.write_text('authentication\
        \ harness fixtures PASS')\n    assert key not in p.read_text()\nprint('AUTHENTICATION HARNESS REGRESSION PASS')\n\
        PY\npython3 \"$RUNNER_TEMP/auth_regression.py\" | tee audit/auth-regression-pass.txt\n"
    - name: MANDATORY Direct and Nested GitHub Authentication Smoke Gate
      shell: bash
      run: "set -euo pipefail\nmkdir -p audit\nclassification(){\n  printf 'classification=%s\\n' \"$1\" | tee audit/authentication-smoke-status.txt\n\
        }\nif [ -z \"${GH_TOKEN:-}\" ]; then\n  classification RUNNER_TOKEN_AUTHENTICATION_INFRASTRUCTURE\n  exit 41\n\
        fi\nif ! repo=\"$(gh api \"repos/$GITHUB_REPOSITORY\" --jq '.full_name' 2>audit/direct-gh-error-redacted.txt)\"\
        ; then\n  classification RUNNER_TOKEN_AUTHENTICATION_INFRASTRUCTURE\n  rm -f audit/direct-gh-error-redacted.txt\n\
        \  exit 42\nfi\nrm -f audit/direct-gh-error-redacted.txt\ntest \"$repo\" = 'basaira/miaad-android' || { classification\
        \ RUNNER_TOKEN_AUTHENTICATION_INFRASTRUCTURE; exit 43; }\nif ! hist=\"$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$V1R6R4_RUN\"\
        \ --jq '.head_sha' 2>/dev/null)\"; then\n  classification RUNNER_TOKEN_AUTHENTICATION_INFRASTRUCTURE\n  exit\
        \ 44\nfi\ntest \"$hist\" = \"$V1R6R4_SHA\" || { classification RUNNER_TOKEN_AUTHENTICATION_INFRASTRUCTURE; exit\
        \ 45; }\necho 'DIRECT GITHUB API AUTHENTICATION PASS' | tee audit/direct-authentication-pass.txt\nif ! python3\
        \ \"$RUNNER_TEMP/run_legacy.py\" --auth-smoke; then\n  classification NESTED_HARNESS_ENVIRONMENT_PROPAGATION_FAILURE\n\
        \  exit 46\nfi\necho 'NESTED HARNESS GITHUB API AUTHENTICATION PASS' | tee audit/nested-authentication-pass.txt\n\
        echo 'TOKEN PROPAGATION CONTRACT PASS' | tee audit/token-propagation-pass.txt\n"
    - name: Frozen identity and topology independently verified
      shell: bash
      run: 'set -euo pipefail

        mkdir -p audit

        test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"

        test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"

        test "$(git diff --name-only "$CANDIDATE_SHA" HEAD | wc -l)" -eq 1

        git diff --name-only "$CANDIDATE_SHA" HEAD | grep -Fxq "$WORKFLOW_PATH"

        python3 "$RUNNER_TEMP/run_legacy.py" verification ''Prove topology and exact candidate diff''

        test "$(git ls-remote origin refs/heads/miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r3 | awk
        ''{print $1}'')" = "$HIST_SHA"


        test "$(git ls-remote origin refs/heads/miaad/phase-1c-occurrence-authority-runtime-verification-v1r6r4 | awk
        ''{print $1}'')" = "$V1R6R4_SHA"

        test "$(git rev-parse "$V1R6R4_SHA^{tree}")" = "$V1R6R4_TREE"

        echo ''V1R6R5 FROZEN BASELINE PREFLIGHT PASS''  | tee audit/baseline-v1r6r5.txt

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install verification dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Install verification dependencies''

        '
    - name: Run complete source suite and historical closures
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Run complete source suite and historical closures''

        '
    - name: Build separated Primary Authority helpers and run source gates
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Build separated Primary Authority helpers and run source
        gates''

        '
    - name: Generate tested WebView69 assets and verify exact historical hashes
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Generate tested WebView69 assets and verify exact historical
        hashes''

        '
    - name: Build generated-suite harness
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Build generated-suite harness''

        '
    - name: Run complete generated suite repeatability primary authority and transform audit
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Run complete generated suite repeatability primary authority
        and transform audit''

        '
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''
    - name: Install Android SDK packages
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Install Android SDK packages''

        '
    - name: Set up Gradle 9.6.0
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.6.0
    - name: Prove clean regeneration equivalence
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Prove clean regeneration equivalence''

        '
    - name: Run Android Gradle gates
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Run Android Gradle gates''

        '
    - name: Audit exact same-run APK
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''verification'' ''Audit exact same-run APK''

        '
    - name: Require same-run APK label package and version
      shell: bash
      run: 'set -euo pipefail

        grep -q "name=''com.miaad.app''" audit/apk-package-version.txt

        grep -q "versionCode=''5''" audit/apk-package-version.txt

        grep -q "versionName=''1.2.0''" audit/apk-package-version.txt

        grep -Fq ''مِيعاد'' audit/apk-application-label.txt

        test -s audit/apk-sha256.txt

        test "$(cat audit/apk-size-bytes.txt)" -gt 1000000

        echo ''SAME-RUN APK METADATA CONTRACT PASS'' | tee audit/apk-metadata-pass.txt

        '
    - name: Upload current-run APK
      uses: actions/upload-artifact@v4
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 90
    - name: Upload source-verification evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-source-verification
        path: 'audit/source-*

          audit/rf1-a-e.txt

          audit/historical-flow-closures.txt

          audit/primary-authority-helper-*

          audit/*authentication*pass.txt

          audit/token-propagation-pass.txt

          audit/auth-regression-pass.txt

          audit/authentication-smoke-status.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload tested-generated evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-tested-generated
        path: 'audit/generated-*

          audit/compat-generation.*

          audit/historical-generated-hashes.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload generated-repeatability evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-generated-repeatability
        path: 'audit/generated-test-flows-repeatability.txt

          audit/generated-flows-attempt-2.txt

          audit/generated-flows-attempt-3.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload primary-authority evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-primary-authority
        path: 'audit/source-primary-*

          audit/generated-primary-*

          audit/clean-generated-primary-*

          audit/primary-authority-helper-separation.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload transform-audit evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-transform-audit
        path: 'audit/generated-classic-script-audit.txt

          audit/generated-global-declarations.json

          audit/transform-audit-helper-syntax.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload clean-regeneration evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-clean-regeneration
        path: 'audit/clean-*

          audit/generated-assets-*

          audit/regeneration-equivalence.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload gradle evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-gradle
        path: 'audit/android-*

          audit/sdkmanager-version.txt

          audit/adb-version.txt'
        if-no-files-found: error
        retention-days: 90
    - name: Upload apk-identity evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-apk-identity
        path: 'audit/authoritative-apk-identity.txt

          audit/apk-sha256.txt

          audit/apk-size-bytes.txt

          audit/apk-package-version.txt

          audit/apk-application-label.txt

          audit/apk-signature.txt

          audit/apk-compat.txt

          audit/apk-metadata-pass.txt'
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
  api26-native:
    name: API26 independent native attempt ${{ matrix.attempt }}
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        attempt:
        - 1
        - 2
    env:
      MIAAD_ATTEMPT: ${{ matrix.attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout V1R6R5
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - *id001
    - name: Verify candidate identity for runtime
      shell: bash
      run: 'set -euo pipefail

        mkdir -p audit

        test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"

        test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$CANDIDATE_TREE"

        test "$(git diff --name-only "$CANDIDATE_SHA" HEAD | wc -l)" -eq 1

        git diff --name-only "$CANDIDATE_SHA" HEAD | grep -Fxq "$WORKFLOW_PATH"'
    - name: Install transport dependency
      shell: bash
      run: python3 -m pip install websocket-client==1.8.0
    - name: Download freshly built APK
      uses: actions/download-artifact@v4
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-apk
        path: app/build/outputs/apk/debug
    - name: Download freshly built APK identity
      uses: actions/download-artifact@v4
      with:
        name: miaad-phase-1c-occurrence-authority-v1r6r5-apk-identity
        path: apk-identity
    - &id002
      name: Validate APK from current run
      shell: bash
      run: 'set -euo pipefail

        mkdir -p audit

        f=app/build/outputs/apk/debug/app-debug.apk

        expected="$(cat apk-identity/apk-sha256.txt)"

        size="$(cat apk-identity/apk-size-bytes.txt)"

        actual="$(sha256sum "$f" | awk ''{print $1}'')"

        actual_size="$(stat -c ''%s'' "$f")"

        test "$actual" = "$expected"

        test "$actual_size" = "$size"

        printf ''main_job_raw_apk_sha256=%s\nmain_job_raw_apk_size=%s\nruntime_raw_apk_sha256=%s\nruntime_raw_apk_size=%s\n''
        "$expected" "$size" "$actual" "$actual_size" | tee audit/apk-identity.txt

        echo "RAW_APK_SHA256=$actual" >> "$GITHUB_ENV"

        echo "RAW_APK_SIZE=$actual_size" >> "$GITHUB_ENV"

        echo ''SAME-RUN APK IDENTITY PASS'' | tee audit/same-run-apk-pass.txt

        '
    - name: Build one-shot fire-and-observe setup probe
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''api26-native'' ''Build one-shot fire-and-observe setup probe''

        '
    - name: Build native snapshot audit
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''api26-native'' ''Build native snapshot audit''

        '
    - name: Build attempt classifier
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''api26-native'' ''Build attempt classifier''

        '
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''
    - name: Ensure platform tools and KVM
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''api26-native'' ''Ensure platform tools and KVM''

        '
    - name: Prepare V3 runtime script
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/run_legacy.py" ''api26-native'' ''Prepare V3 runtime script''

        '
    - name: Installed Android API26 native snapshot restart
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        disable-animations: false
        script: bash /tmp/miaad-api26-native-snapshot-v3.sh
    - name: Require complete native attempt evidence
      shell: bash
      run: "set -euo pipefail\nmkdir -p audit\nif [ ! -s audit/attempt-classification.json ]; then\n printf '{\"attempt\"\
        :%s,\"case\":\"HARNESS_INCOMPLETE\",\"classification\":\"TEST / VERIFICATION HARNESS\"}\n' \"$MIAAD_ATTEMPT\"\
        \ > audit/attempt-classification.json\nfi\npython3 - <<'PY'\nimport os,json\nfrom pathlib import Path\nr=json.loads(Path('audit/attempt-classification.json').read_text())\n\
        assert r.get('attempt')==int(os.environ['MIAAD_ATTEMPT'])\nassert r.get('preRestartStatus')=='PASS' and r.get('postRestartStatus')=='PASS'\

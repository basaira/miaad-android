        \ EVIDENCE INCOMPLETE')\n        time.sleep(min(.6,max(.01,deadline-time.monotonic())))\nPY\ncat > \"$RUNNER_TEMP/apply_review_fix_A.py\"\
        \ <<'PY'\nimport os, pathlib, re\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'v1_snapshot_audit.py'\ns=p.read_text()\n\
        a=s.index('def read_snapshot(label, poll=False):')\nb=s.index('def latest_lesson(',a)\npatch=pathlib.Path(os.environ['RUNNER_TEMP'])/'review_fix_A.py'\n\
        s=s[:a]+patch.read_text()+'\\n'+s[b:]\nold='    except Exception as e:\\n        out={\"label\":\"after-restart\"\

        \            subprocess.run(['bash','-n'],input=script,text=True,check=True)\nfor kind,names in {\n 'verification':['Prove topology and exact candidate diff','Install verification dependencies','Run complete source suite and historical closures','Build separated Primary Authority helpers and run source gates','Generate tested WebView69 assets and verify exact historical hashes','Build generated-suite harness','Run complete generated suite repeatability primary authority and transform audit','Install Android SDK packages','Prove clean regeneration equivalence','Run Android Gradle gates','Audit exact same-run APK'],\n 'api26-native':['Build one-shot fire-and-observe setup probe','Build native snapshot audit','Build attempt classifier','Ensure platform tools and KVM','Prepare V3 runtime script'],\n 'api36-native':['Build one-shot fire-and-observe setup probe','Build native snapshot audit','Build attempt classifier','Ensure platform tools and KVM','Prepare V1R2 runtime script']}.items():\n\

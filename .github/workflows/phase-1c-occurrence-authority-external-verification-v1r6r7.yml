        base = {'schemaVersion': 4, 'domain': {'version': 4, 'records': {}, 'schedules': {}}, 'flag': 'pass', 'generation': 1}\ndef xml_data(data):\n    return ('<map><string name=\"snapshot\">' + xml.sax.saxutils.escape(json.dumps(data)) + '</string></map>').encode()\nGOOD = xml_data(base)\nBAD_STRUCTURE = xml_data({'schemaVersion': 2, 'domain': {'version': 2}})\nNO_KEY = b'<map><string name=\"else\">foo</string></map>'\nBAD_JSON = b'<map><string name=\"snapshot\">{bad}</string></map>'\nWRONG = xml_data(dict(base, flag='wrong'))\nINCOMPLETE = xml_data(dict(base, flag='incomplete'))\nVARIANT = xml_data(dict(base, generation=2))\n\ncases = [\n    ('two-stable', [GOOD, GOOD], 'PASS'),\n    ('adb-nonzero-then-valid', [(1, b''), GOOD, GOOD], 'PASS'),\n    ('empty-then-valid', [b'', GOOD, GOOD], 'PASS'),\n    ('xml-invalid-then-valid', [b'<map>', GOOD, GOOD], 'PASS'),\n    ('missing-key-then-valid', [NO_KEY, GOOD, GOOD], 'PASS'),\n    ('json-invalid-then-valid', [BAD_JSON, GOOD, GOOD], 'PASS'),\n\

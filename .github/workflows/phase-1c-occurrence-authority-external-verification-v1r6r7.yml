        \  if len(list(folder.glob('*.json')))!=1:\n   errors.append('FINAL VERDICT EVIDENCE INVALID: '+str(path)+' (unexpected JSON multiplicity)')\n   verdict[name]=False;continue\n  try:\n   obj=json.loads(path.read_text(encoding='utf-8'))\n   if not isinstance(obj,dict) or type(obj.get('authoritativePass')) is not bool:raise ValueError('authoritativePass must be boolean')\n   if obj['authoritativePass'] is not True:errors.append('SEMANTIC VERDICT FALSE: '+str(path))\n   verdict[name]=obj['authoritativePass'] is True\n  except Exception as e:\n   errors.append('FINAL VERDICT EVIDENCE INVALID: '+str(path)+' '+repr(e));verdict[name]=False\n for suffix in MANDATORY:\n  directory=root/(PREFIX+suffix)\n  if not directory.is_dir() or not any(directory.rglob('*')):\n   errors.append('FINAL VERDICT EVIDENCE MISSING: '+str(directory))\n for name,result in jobs.items():\n  if result!='success':errors.append('MANDATORY JOB NOT SUCCESS: '+name+' = '+str(result))\n immut=root/(PREFIX+'post-run-immutability')/'post-run-immutability.txt'\n\
        \ if not immut.is_file():errors.append('FINAL VERDICT EVIDENCE MISSING: '+str(immut))\n elif 'POST-RUN IMMUTABILITY PASS — NO PROMOTION' not in immut.read_text():errors.append('FINAL VERDICT EVIDENCE INVALID: '+str(immut))\n # Each runtime verdict must represent BOTH genuinely independent attempts.\n for name in ('api26','api36'):\n  p=root/(PREFIX+MAP[name][0])/MAP[name][1]\n  if p.is_file():\n   try:\n    obj=json.loads(p.read_text())\n    attempts=obj.get('attempts')\n    if not isinstance(attempts,list) or sorted(x.get('attempt') for x in attempts)!=[1,2]:\n     errors.append('FINAL VERDICT EVIDENCE INVALID: '+str(p)+' (two attempts required)')\n   except Exception:pass\n return {'authoritativePass':not errors,'errors':errors,'verdicts':verdict,'jobs':jobs}\nPY\npython3 -m py_compile \"$RUNNER_TEMP/final_check.py\"\npython3 - <<'PY'\nimport os,json,sys\nfrom pathlib import Path\nexec((Path(os.environ['RUNNER_TEMP'])/'final_check.py').read_text())\nr=check('evidence',{k:v for\
        \ k,v in os.environ.items() if k.startswith('STATUS_')})\n# The source evidence must include the direct and nested smoke pass markers.\nimport glob\nsource=list(Path('evidence').glob('miaad-phase-1c-occurrence-authority-v1r6r7-source-verification/**/*'))\nfor marker in ('direct-authentication-pass.txt','nested-authentication-pass.txt','token-propagation-pass.txt','auth-regression-pass.txt'):\n    paths=[p for p in source if p.name==marker]\n    if len(paths)!=1 or 'PASS' not in paths[0].read_text():\n        r['errors'].append('FINAL VERDICT EVIDENCE MISSING: AUTHENTICATION '+marker)\n        r['authoritativePass']=False\nPath('final-verdict-v1r6r7.json').write_text(json.dumps(r,indent=2))\nif not r['authoritativePass']:\n print('EXTERNAL VERIFICATION V1R6R7 FAILED');print(json.dumps(r,indent=2));sys.exit(2)\nprint('EXTERNAL VERIFICATION V1R6R7 PASS — READY FOR PROMOTION REVIEW')\nprint('PHASE 1C STATUS = OPEN')\nprint('NEXT GATE = INDEPENDENT PROMOTION REVIEW')\nprint('DO NOT PROMOTE')\n\
        print('STOP')\nPY\n"

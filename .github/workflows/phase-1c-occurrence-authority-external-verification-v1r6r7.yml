        \           'validJsonObserved':any_json,'appPid':pid,\n           'startupSignals':{k:(k in signals) for k in ('page-finished','first-frame-ready','content-ready')},\n           'firstFailure':next((x for x in samples if x.get('reason')),None),\n           'lastFailure':next((x for x in reversed(samples) if x.get('reason')),None)}\n        AUDIT.joinpath('snapshot-read-telemetry-'+label+'.json').write_text(json.dumps(t,indent=2,ensure_ascii=False),encoding='utf-8')\n    while True:\n        remaining=deadline-time.monotonic()\n        if remaining<=0:\n            telemetry('INCOMPLETE','API36 POST-RESTART SNAPSHOT EVIDENCE INCOMPLETE')\n            raise SnapshotEvidenceError('API36 POST-RESTART SNAPSHOT EVIDENCE INCOMPLETE')\n        tick=time.monotonic()\n        item={'attempt':len(samples)+1,'elapsedSeconds':round(tick-start,3),'bytes':0,'sha256':None,'adbReturnCode':None,'xmlParsed':False,'jsonParsed':False,'reason':None}\n        samples.append(item)\n        try:\n     \
        \       p=adb('exec-out','cat',PREFS,timeout=max(.5,min(5.0,remaining)))\n            raw=p.stdout or b''\n            item['adbReturnCode']=p.returncode\n            item['bytes']=len(raw)\n            item['sha256']=hashlib.sha256(raw).hexdigest()\n            if p.returncode!=0:\n                raise ValueError('ADB_NONZERO: '+str(p.returncode)+' '+(p.stderr or b'').decode('utf-8','replace')[:180])\n            if not raw: raise ValueError('ADB_EMPTY_OUTPUT')\n            root=ET.fromstring(raw)\n            item['xmlParsed']=True\n            any_xml=True\n            node=next((n for n in root.findall('string') if n.attrib.get('name')=='snapshot'),None)\n            if node is None or not node.text: raise ValueError('MISSING_SNAPSHOT_KEY')\n            raw_json=node.text\n            data=json.loads(raw_json)\n            item['jsonParsed']=True\n            any_json=True\n            if not isinstance(data,dict) or data.get('schemaVersion')!=4 or not isinstance(data.get('domain'),dict)\
        \ or data['domain'].get('version')!=4 or not isinstance(data['domain'].get('records'),dict) or not isinstance(data['domain'].get('schedules'),dict):\n                raise ValueError('STRUCTURE_INVALID')\n            proof=audit_snapshot(raw_json,data,label)\n            item['semanticStatus']=proof.get('status')\n            if proof.get('status')=='WRONG':\n                item['reason']='VALIDATED_SEMANTIC_CONTRADICTION'\n                telemetry('SEMANTIC_CONTRADICTION',item['reason'])\n                raise SnapshotContradiction('VALIDATED_SEMANTIC_CONTRADICTION '+str([k for k,v in (proof.get('checks') or {}).items() if v is False]))\n            if proof.get('status')!='PASS':\n                item['reason']='SEMANTIC_SETUP_INCOMPLETE'\n                stable_signature=None\n            else:\n                sig=json.dumps(semantic_fingerprint(data),sort_keys=True,ensure_ascii=False)\n                item['semanticSha256']=hashlib.sha256(sig.encode()).hexdigest()\n      \
        \          if stable_signature==sig:\n                    AUDIT.joinpath('miaad_native_v1-'+label+'.xml').write_bytes(raw)\n                    AUDIT.joinpath('native-snapshot-'+label+'.raw.json').write_text(raw_json,encoding='utf-8')\n                    AUDIT.joinpath('native-snapshot-'+label+'.json').write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding='utf-8')\n                    telemetry('PASS')\n                    return raw_json,data\n                stable_signature=sig\n                item['reason']='AWAITING_INDEPENDENT_STABLE_READ'\n        except SnapshotContradiction:\n            raise\n        except Exception as err:\n            item['reason']=type(err).__name__+': '+str(err)[:240]\n            stable_signature=None\n        if time.monotonic()>=deadline:\n            telemetry('INCOMPLETE','API36 POST-RESTART SNAPSHOT EVIDENCE INCOMPLETE')\n            raise SnapshotEvidenceError('API36 POST-RESTART SNAPSHOT EVIDENCE INCOMPLETE')\n        time.sleep(min(.6,max(.01,deadline-time.monotonic())))\n\
        PY\ncat > \"$RUNNER_TEMP/apply_review_fix_A.py\" <<'PY'\nimport os, pathlib, re\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'v1_snapshot_audit.py'\ns=p.read_text()\na=s.index('def read_snapshot(label, poll=False):')\nb=s.index('def latest_lesson(',a)\npatch=pathlib.Path(os.environ['RUNNER_TEMP'])/'review_fix_A.py'\ns=s[:a]+patch.read_text()+'\\n'+s[b:]\nold='    except Exception as e:\\n        out={\"label\":\"after-restart\",\"status\":\"INCOMPLETE\",\"error\":repr(e)}'\nnew='    except SnapshotContradiction as e:\\n        out={\"label\":\"after-restart\",\"status\":\"WRONG\",\"error\":repr(e)}\\n    except Exception as e:\\n        out={\"label\":\"after-restart\",\"status\":\"INCOMPLETE\",\"error\":repr(e)}'\nif s.count(old)!=1:raise SystemExit('POST MODE CONTRADICTION HANDLER NOT FOUND')\ns=s.replace(old,new)\nold_pre='    except Exception as e:\\n        out={\"label\":\"before-restart\",\"status\":\"INCOMPLETE\",\"error\":repr(e),\"checks\":{\"setupCompletionMarker\":False}}'\n\
        new_pre='    except SnapshotContradiction as e:\\n        out={\"label\":\"before-restart\",\"status\":\"WRONG\",\"error\":repr(e),\"checks\":{\"setupCompletionMarker\":True}}\\n    except Exception as e:\\n        out={\"label\":\"before-restart\",\"status\":\"INCOMPLETE\",\"error\":repr(e),\"checks\":{\"setupCompletionMarker\":False}}'\nif s.count(old_pre)!=1:raise SystemExit('PRE MODE CONTRADICTION HANDLER NOT FOUND')\ns=s.replace(old_pre,new_pre)\np.write_text(s)\nprint('API36 POST-RESTART SNAPSHOT READ-RETRY PATCH PASS')\nPY\npython3 -m py_compile \"$RUNNER_TEMP/review_fix_A.py\" \"$RUNNER_TEMP/apply_review_fix_A.py\"\npython3 \"$RUNNER_TEMP/apply_review_fix_A.py\"\npython3 -m py_compile \"$RUNNER_TEMP/v1_snapshot_audit.py\"\necho 'API36 NATIVE SNAPSHOT HELPER SYNTAX PASS'\n"
